<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BJCP Beer Exam Prep</title>
<style>
:root{
  --bg:#faf7f2;--panel:#ffffff;--ink:#241c15;--muted:#6b5f53;--line:#e6dfd3;
  --accent:#b8650a;--accent-ink:#ffffff;--accent-soft:#fbead2;
  --good:#2f7d3a;--good-soft:#e1f2e3;--bad:#b3261e;--bad-soft:#fbe3e1;--warn:#9a6a00;--warn-soft:#fff1cc;
  --shadow:0 1px 2px rgba(60,40,10,.08),0 4px 14px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17130f;--panel:#201a14;--ink:#f1e9de;--muted:#a99c8d;--line:#3a3025;
    --accent:#e8a24a;--accent-ink:#1b1206;--accent-soft:#3a2a14;
    --good:#6fcf7a;--good-soft:#1c3320;--bad:#ff8a80;--bad-soft:#3b1f1d;--warn:#f0c15a;--warn-soft:#3a2d0f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#17130f;--panel:#201a14;--ink:#f1e9de;--muted:#a99c8d;--line:#3a3025;
  --accent:#e8a24a;--accent-ink:#1b1206;--accent-soft:#3a2a14;
  --good:#6fcf7a;--good-soft:#1c3320;--bad:#ff8a80;--bad-soft:#3b1f1d;--warn:#f0c15a;--warn-soft:#3a2d0f;--shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.3rem}h3{font-size:1.08rem}
p{margin:.4em 0 .8em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:600}
nav.tabs button:hover{background:var(--accent-soft);color:var(--ink)}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink)}
nav.tabs .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
nav.tabs button.on .dot{background:var(--accent-ink)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:650}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.good{background:var(--good);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:.9rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.small{font-size:.88rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:650;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.bar{height:9px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)}.bar.bad>i{background:var(--bad)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.big{font-size:2.4rem;font-weight:750;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=search]{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
label.chk{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
ul.tight{margin:.3em 0 .6em;padding-left:1.2em}ul.tight li{margin:.3em 0}
/* learn */
.learn{display:grid;grid-template-columns:230px 1fr;gap:18px}
@media(max-width:760px){.learn{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px;align-self:start}
@media(max-width:760px){.side{position:static;flex-direction:row;flex-wrap:wrap}}
.side button{text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:8px 10px;color:var(--ink);font-weight:600}
.side button.on{background:var(--accent-soft);border-color:var(--accent)}
.side button .done{color:var(--good);float:right}
/* quiz */
.qtext{font-size:1.15rem;font-weight:600;margin:.3em 0 .9em}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin:7px 0}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .k{min-width:22px;height:22px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--muted);flex:none;margin-top:1px}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.feedback.good{background:var(--good-soft);border-color:var(--good)}.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:700;font-size:1.05rem}
/* flashcards */
.flash{perspective:1200px}
.fc{min-height:230px;display:grid;place-items:center;text-align:center;padding:26px;cursor:pointer;font-size:1.2rem;border:2px dashed var(--line);border-radius:16px;background:var(--panel)}
.fc.back{background:var(--accent-soft);border:2px solid var(--accent);font-size:1.1rem}
.fc small{display:block;color:var(--muted);font-size:.8rem;margin-top:10px}
/* exam */
.timer{font-variant-numeric:tabular-nums;font-weight:750;font-size:1.3rem}
.timer.low{color:var(--bad)}
.examq{padding:14px 0;border-bottom:1px solid var(--line)}
.examq:last-child{border:0}
.qnum{font-weight:700;color:var(--muted);margin-right:6px}
.mark{cursor:pointer}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.sumgrid button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 0;font-weight:650}
.sumgrid button.ans{background:var(--good-soft);border-color:var(--good)}
.sumgrid button.un{background:var(--bad-soft);border-color:var(--bad)}
.sumgrid button.mk{outline:2px solid var(--warn)}
/* styles */
.sty{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.sty h3{display:flex;align-items:center;gap:9px}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:.5em 0}
.stats div{background:var(--bg);border-radius:8px;padding:6px 9px;font-size:.88rem}
.stats b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.sty ul{margin:.3em 0 0;padding-left:1.1em;font-size:.93rem}.sty li{margin:.28em 0}
.hide-details .sty .more{display:none}
.hide-details .sty.open .more{display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:.92rem;z-index:50}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;margin:.8em 0}
details>summary{cursor:pointer;font-weight:650}
@media print{header.top{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="logo">&#127866;</span> BJCP Beer Exam Prep</div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main id="app"></main>
<script>
const STYLEDATA={"cats": {"1": "Standard American Beer", "2": "International Lager", "3": "Czech Lager", "4": "Pale Malty European Lager", "5": "Pale Bitter European Beer", "6": "Amber Malty European Lager", "7": "Amber Bitter European Beer", "8": "Dark European Lager", "9": "Strong European Beer", "10": "German Wheat Beer", "11": "British Bitter", "12": "Pale Commonwealth Beer", "13": "Brown British Beer", "14": "Scottish Ale", "15": "Irish Beer", "16": "Dark British Beer", "17": "Strong British Ale", "18": "Pale American Ale", "19": "Amber and Brown American Beer", "20": "American Porter and Stout", "21": "IPA", "22": "Strong American Ale", "23": "European Sour Ale", "24": "Belgian Ale", "25": "Strong Belgian Ale", "26": "Monastic Ale"}, "styles": [{"code": "1A", "name": "American Light Lager", "cat": 1, "catName": "Standard American Beer", "stats": {"OG": [1.028, 1.04], "FG": [0.998, 1.008], "IBU": [8.0, 12.0], "SRM": [2.0, 3.0], "ABV": [2.8, 4.2]}, "text": ["Aroma: little to none; optional faint grainy/corn sweetness, trace spicy/floral hop. Flavor: neutral, crisp, dry; very low grainy/corn note; very low bitterness. Mouthfeel: very light, sometimes watery; very high carbonation, slight bite.", "Lager yeast, clean (slight yeast character not a fault); no diacetyl/DMS mentioned; strong flavors = fault. Negligible hops. 2-/6-row barley with up to 40% rice/corn; enzymes may cut carbs.", "Comparison: lighter, lower alcohol/calorie than American Lager; less hop/bitterness than German Leichtbier.", "Commercial: Bud Light, Coors Light, Miller Lite, Michelob Light, Old Milwaukee Light."]}, {"code": "1B", "name": "American Lager", "cat": 1, "catName": "Standard American Beer", "stats": {"OG": [1.04, 1.05], "FG": [1.004, 1.01], "IBU": [8.0, 18.0], "SRM": [2.0, 3.5], "ABV": [4.2, 5.3]}, "text": ["Aroma: faint grainy/corn-sweet; optional light spicy/floral hop. Flavor: neutral, crisp dry finish; moderately-low to low grainy/corn; low to med-low bitterness; optional modest hop flavor. Mouthfeel: low to med-low body; very high carbonation, slight bite.", "Lager yeast, clean; strong flavors = fault; light hopping; up to 40% rice/corn adjunct.", "Comparison: more flavor/body than Light Lager; less bitterness/flavor than Intl Pale Lager; far less than European Pilsner.", "Commercial: Budweiser, Coors Original, Miller High Life, Pabst Blue Ribbon, Old Style."]}, {"code": "1C", "name": "Cream Ale", "cat": 1, "catName": "Standard American Beer", "stats": {"OG": [1.042, 1.055], "FG": [1.006, 1.012], "IBU": [8.0, 20.0], "SRM": [2.0, 5.0], "ABV": [4.2, 5.6]}, "text": ["Aroma: low malt, sweet corn-like; low DMS optional; optional low hop (floral/spicy/herbal); low fruity esters optional. Flavor: neutral/grainy/crackery malt, low-moderate corny note, light DMS optional, well attenuated, dry-crisp to faintly sweet. Mouthfeel: light, crisp, smooth; high carbonation; body up to medium.", "Clean ale yeast (or ale+lager mix); 6-row or 6-row/2-row; up to 20% maize in mash and up to 20% sugar in boil; any hops (often rustic American/continental). Commercial OG mostly 1.050-1.053, IBU rarely >20.", "Comparison: more character than American Lager; lighter, smoother, more carbonated than Blonde Ale; can resemble a subtle Kolsch.", "Commercial: Genesee Cream Ale, Little Kings Cream Ale, Sleeman Cream Ale, Sun King Sunlight."]}, {"code": "1D", "name": "American Wheat Beer", "cat": 1, "catName": "Standard American Beer", "stats": {"OG": [1.04, 1.055], "FG": [1.008, 1.013], "IBU": [15.0, 30.0], "SRM": [3.0, 6.0], "ABV": [4.0, 5.5]}, "text": ["Aroma: grainy/bready/doughy wheat; light malt sweetness ok; low-mod citrusy/spicy/floral/fruity hops (not typically dry-hopped); moderate esters optional but NO banana, NO clove phenols. Flavor: wheat bready/doughy, dry-crisp to moderately sweet; low-mod bitterness; low-mod hop flavor. Mouthfeel: med-light to medium; med-high to high carbonation; slight creaminess optional.", "Clean American ale (or lager) yeast; German weizen yeast inappropriate. Wheat malt often 30-50%. American, German or New World hops. Brilliant or hazy both ok. American rye beers go in 31A.", "Comparison: more hops, less yeast character than Weissbier; same range/balance as Blonde Ale but wheat-led.", "Commercial: Bell's Oberon, Boulevard Unfiltered Wheat, Goose Island 312 Urban Wheat, Widmer Hefeweizen."]}, {"code": "2A", "name": "International Pale Lager", "cat": 2, "catName": "International Lager", "stats": {"OG": [1.042, 1.05], "FG": [1.008, 1.012], "IBU": [18.0, 25.0], "SRM": [2.0, 6.0], "ABV": [4.5, 6.0]}, "text": ["Aroma: low to med-low grainy/slightly corny malt; very low-medium spicy/floral/herbal hop. Flavor: low-moderate grainy malt, med-low to medium bitterness, crisp dry well-attenuated finish; optional corny sweetness; neutral aftertaste. Mouthfeel: light-medium body; mod-high to high carbonation, slight bite.", "Clean lager yeast; 2-/6-row; rice/corn/sugar allowed but generally all-malt; skunkiness in commercial beers = handling fault. Entrant may specify regional variant (Mexican lager etc.).", "Comparison: more bitter/filling than American Lager; less than German Pils; less body/malt/hop than Czech Premium Pale; robust versions near Helles but with adjunct quality.", "Commercial: Heineken, Corona Extra, Asahi Super Dry, Red Stripe, Singha, Birra Moretti."]}, {"code": "2B", "name": "International Amber Lager", "cat": 2, "catName": "International Lager", "stats": {"OG": [1.042, 1.055], "FG": [1.008, 1.014], "IBU": [8.0, 25.0], "SRM": [6.0, 14.0], "ABV": [4.5, 6.0]}, "text": ["Aroma: low-mod grainy malt with caramel/toasty accents, occasionally nutty/biscuity, never roasty; low floral/spicy hops. Flavor: low-mod malt with caramel or toasty-bready notes; optional low corny sweetness; low-mod bitterness; moderately dry, malty aftertaste. Mouthfeel: light-medium, smooth, medium to high carbonation, sometimes slightly creamy.", "Clean lager yeast; 2-/6-row, caramel/Victory/amber/roast malt; adjuncts, sugar or coloring possible; European or American hops.", "Comparison: less malt development than Vienna Lager (adjunct taste); less robust/bitter than Altbier.", "Commercial: Yuengling Lager, Brooklyn Lager, Abita Amber, Dos Equis Amber, Capital Wisconsin Amber."]}, {"code": "2C", "name": "International Dark Lager", "cat": 2, "catName": "International Lager", "stats": {"OG": [1.044, 1.056], "FG": [1.008, 1.012], "IBU": [8.0, 20.0], "SRM": [14.0, 30.0], "ABV": [4.2, 6.0]}, "text": ["Aroma: faint malt; optional med-low roast/caramel; light hops optional. Flavor: low-med sweet maltiness, optional caramel/roast with coffee/molasses/brown sugar/cocoa hints; low-med bitterness; very light fruitiness possible; moderately crisp; burnt or strong roast inappropriate. Mouthfeel: light to med-light, smooth, light creaminess; medium to high carbonation.", "Clean lager yeast; corn/rice/sugar adjuncts typical; light caramel/dark roast malts; coloring agents may be used.", "Comparison: less flavor/richness than Munich Dunkel or Schwarzbier.", "Commercial: Baltika #4, Shiner Bock, Heineken Dark, San Miguel Dark, Dixie Blackened Voodoo."]}, {"code": "3A", "name": "Czech Pale Lager", "cat": 3, "catName": "Czech Lager", "stats": {"OG": [1.028, 1.044], "FG": [1.008, 1.014], "IBU": [20.0, 35.0], "SRM": [3.0, 6.0], "ABV": [3.0, 4.1]}, "text": ["Aroma: light-mod bready-rich malt + light-mod spicy/herbal (Saaz-type) hops; faint caramel ok; light non-intrusive diacetyl and light fruity esters optional; no sulfur. Flavor: med-low to medium bready malt, rounded hoppy finish; prominent but never harsh bitterness. Mouthfeel: med-light to medium, moderate carbonation.", "Czech Pilsner malt, Czech hops, Czech lager yeast, soft water. Most-consumed beer in Czechia.", "Comparison: lighter, lower-intensity everyday version of Czech Premium Pale Lager.", "Commercial: Bernard svetle 10, Radegast Razna 10, Primator Antonin, Unetice 10, Breznak."]}, {"code": "3B", "name": "Czech Premium Pale Lager", "cat": 3, "catName": "Czech Lager", "stats": {"OG": [1.044, 1.06], "FG": [1.013, 1.017], "IBU": [30.0, 45.0], "SRM": [3.5, 6.0], "ABV": [4.2, 5.8]}, "text": ["Aroma: medium to med-high bready-rich malt with med-low to med-high spicy/floral/herbal hops; light diacetyl or very low fruity esters optional. Flavor: rich complex bready malt, pronounced yet soft rounded bitterness, floral/spicy hop flavor, long finish balanced between malt and hops; light to moderately-low diacetyl and low hop-derived esters acceptable. Mouthfeel: medium body; moderate to low carbonation.", "Czech malt/hops/yeast; low-sulfate/carbonate soft water; decoction traditional. Unfiltered kvasnicove (yeast beer) versions exist. Only Pilsner Urquell and Gambrinus called \"Pilsner\" in Czechia.", "Comparison: more color, malt richness, body, fuller/softer than German Pils; stronger than Czech Pale Lager.", "Commercial: Pilsner Urquell, Budvar 33, Bernard Svateční lezak, Unetice 12, Primator Premium, Radegast Ryze horka 12."]}, {"code": "3C", "name": "Czech Amber Lager", "cat": 3, "catName": "Czech Lager", "stats": {"OG": [1.044, 1.06], "FG": [1.013, 1.017], "IBU": [20.0, 35.0], "SRM": [10.0, 16.0], "ABV": [4.4, 5.8]}, "text": ["Aroma: moderate rich malt, bready/Maillard-dominant or caramel-sweet; spicy/floral hops moderate to none; low stone-fruit/berry esters possible; low diacetyl optional. Flavor: medium to med-high complex malt (dry-Maillard to caramelly, sometimes graham-cracker), low-mod spicy hops, clean prominent bitterness; subtle plum/berry esters and low diacetyl optional; no roast. Mouthfeel: medium-full to medium, soft, gently creamy, moderate to low carbonation.", "Pilsner + caramel malts (Vienna/Munich possible), Czech hops/yeast, soft water.", "Comparison: like Vienna Lager but stronger Czech late-hop; or a richer, caramelly British Bitter; big-brewery versions resemble Premium Pale with darker malt, small breweries more hop/malt complexity or sweetness.", "Commercial: Kozel Semi-Dark, Bernard Jantarovy lezak, Gambrinus Polotmava 12, Primator polotmavy 13, Lobkowicz Demon 13."]}, {"code": "3D", "name": "Czech Dark Lager", "cat": 3, "catName": "Czech Lager", "stats": {"OG": [1.044, 1.06], "FG": [1.013, 1.017], "IBU": [18.0, 34.0], "SRM": [17.0, 35.0], "ABV": [4.4, 5.8]}, "text": ["Aroma: med to med-high rich, sometimes sweet malt (bread crust, toast, nuts, cola, dark fruit, caramel); roast (chocolate/sweet coffee) none-moderate; low-mod spicy hops optional; low diacetyl and low-mod plum/berry esters may occur. Flavor: medium to med-high deep malt dominates, Maillard richness, light-mod residual sweetness, very low-mod roast; low-mod spicy hop; moderate to med-low but perceptible bitterness; low-mod diacetyl and light esters possible. Mouthfeel: medium to medium-full, moderately creamy, smooth; moderate-low carbonation; stronger versions slightly warming.", "Pilsner + dark caramel malts, debittered roast; Vienna/Munich ok; Czech hops/yeast; soft water. Traditional versions ~18-20 IBU and sweeter; modern drier/more bitter.", "Comparison: Czech equivalent spanning Munich Dunkel to Schwarzbier, but richer malt and more hop aroma/flavor/bitterness.", "Commercial: U Fleku Flekovsky tmavy 13, Kozel Dark, Krusovice cerne, Budvar tmavy lezak, Bernard cerny lezak 12, Herold tmave silne 13."]}, {"code": "4A", "name": "Munich Helles", "cat": 4, "catName": "Pale Malty European Lager", "stats": {"OG": [1.044, 1.048], "FG": [1.006, 1.012], "IBU": [16.0, 22.0], "SRM": [3.0, 5.0], "ABV": [4.7, 5.4]}, "text": ["Aroma: moderate grainy-sweet malt; low to mod-low spicy/floral/herbal hop; clean. Flavor: moderately malty start suggesting sweetness, soft rounded palate, low to med-low bitterness, soft dry finish (not crisp); malt dominates hops but hops noticeable; no real residual sweetness. Mouthfeel: medium body, medium carbonation, smooth, well-lagered.", "Continental Pilsner malt, German hops, clean German lager yeast. (Helles Lagerbier.)", "Comparison: Dunkel-like balance but pale/less sweet; more body/malt than German Pils; fewer hops and slightly less ABV than Exportbier; less body/alcohol than Festbier.", "Commercial: Augustiner Lagerbier Hell, Spaten Munchner Hell, Paulaner Munchner, Weihenstephaner Original, Hacker-Pschorr Munchner Gold."]}, {"code": "4B", "name": "Festbier", "cat": 4, "catName": "Pale Malty European Lager", "stats": {"OG": [1.054, 1.057], "FG": [1.01, 1.012], "IBU": [18.0, 25.0], "SRM": [4.0, 6.0], "ABV": [5.8, 6.3]}, "text": ["Aroma: moderate malty richness, toasty-doughy, impression of sweetness; low to med-low floral/herbal/spicy hops; not deeply toasted/caramel/biscuity; clean. Flavor: medium to med-high lightly toasty bread-dough malt, med to med-low bitterness, malty balance, well-attenuated and crisp but not dry; med-low to medium hop flavor. Mouthfeel: medium, smooth, somewhat creamy, medium carbonation; alcohol barely warming.", "Mostly Pils malt with some Vienna/Munich; German lager yeast. Gold, no amber hues; modern Oktoberfest beer (Wiesn); \"Oktoberfestbier\" is a protected term.", "Comparison: less intense/toasty than Marzen; stronger than Helles with more body/hop/malt; less rich than Helles Bock; malt complexity like a high-gravity Czech Premium Pale without the hops.", "Commercial: Paulaner Oktoberfest Bier, Hofbrau Oktoberfestbier, Augustiner Oktoberfest, Weihenstephaner Festbier, Hacker-Pschorr Superior Festbier, Lowenbrau Oktoberfestbier."]}, {"code": "4C", "name": "Helles Bock", "cat": 4, "catName": "Pale Malty European Lager", "stats": {"OG": [1.064, 1.072], "FG": [1.011, 1.018], "IBU": [23.0, 35.0], "SRM": [6.0, 9.0], "ABV": [6.3, 7.4]}, "text": ["Aroma: mod to strong grainy-sweet malt with light toast and Maillard; mod-low spicy/herbal/floral hop optional; clean; low esters and light alcohol optional. Flavor: mod to mod-strong grainy-sweet/doughy/bready/lightly toasty malt with some Maillard; moderate bitterness (hoppier than other bocks); optional low-mod hop flavor; well-attenuated, moderately dry finish. Mouthfeel: medium body, mod to mod-high carbonation, smooth, light warming optional.", "Pils/Vienna/Munich malts, no adjuncts, light pale crystal possible; German hops; clean lager yeast; decoction traditional but with less boiling to limit color; soft water.", "Comparison: pale Dunkles Bock, or Helles/Festbier at bock strength; drier, hoppier than Dunkles Bock; weaker than pale Doppelbock.", "Commercial: Ayinger Maibock, Hofbrau Maibock, Einbecker Mai-Urbock, Mahr's Heller Bock, Hacker-Pschorr Hubertus Bock, Altenmunster Maibock."]}, {"code": "5A", "name": "German Leichtbier", "cat": 5, "catName": "Pale Bitter European Beer", "stats": {"OG": [1.026, 1.034], "FG": [1.006, 1.01], "IBU": [15.0, 28.0], "SRM": [1.5, 4.0], "ABV": [2.4, 3.6]}, "text": ["Aroma: low-med spicy/herbal/floral hop; low to med-low grainy-sweet/crackery malt; clean. Flavor: low-med grainy-sweet malt, medium bitterness, low-med hop flavor, dry finish. Mouthfeel: light to very light, medium to high carbonation, smooth.", "Pils malt, German lager yeast and hops. Schankbier gravity class; diet-oriented. Leicht variants of wheat/Kolsch/Alt go to 34B.", "Comparison: lighter, slightly less aggressive German Pils/Helles; more bitter and flavorful than American Light Lager.", "Commercial: Greif Brau Leicht, Schonramer Surtaler Schankbier, Mullerbrau Heimer Leicht, Waldhaus Sommer Bier, Autenrieder Schlossbrau Leicht."]}, {"code": "5B", "name": "Kolsch", "cat": 5, "catName": "Pale Bitter European Beer", "stats": {"OG": [1.044, 1.05], "FG": [1.007, 1.011], "IBU": [18.0, 30.0], "SRM": [3.5, 5.0], "ABV": [4.4, 5.2]}, "text": ["Aroma: low grainy-sweet malt; subtle optional apple/pear/cherry fruit; low floral/spicy/herbal hop optional; clean, fresh. Flavor: delicate balance of malt, fruitiness, hops; med-low to medium bitterness; soft, rounded, dry slightly crisp finish; no real residual sweetness; no component strong. Mouthfeel: med-light to medium (mostly med-light), medium to med-high carbonation, smooth, soft.", "TOP-fermented (clean attenuative German ale yeast, ~15 C), then cold conditioned near freezing up to a month; Pils/Pale/Vienna malt, occasional wheat; German hops. Protected appellation (Kolsch Konvention 1986). Oxidation-prone; served in a Stange.", "Comparison: can be mistaken for Cream Ale or a subtle German Pils.", "Commercial: Fruh Kolsch, Gaffel Kolsch, Reissdorf Kolsch, Paffgen, Sunner, Mulhen, Sion."]}, {"code": "5C", "name": "German Helles Exportbier", "cat": 5, "catName": "Pale Bitter European Beer", "stats": {"OG": [1.05, 1.058], "FG": [1.008, 1.015], "IBU": [20.0, 30.0], "SRM": [4.0, 6.0], "ABV": [5.0, 6.0]}, "text": ["Aroma: med-low to medium floral/spicy/herbal hop; moderate grainy-sweet malt (light toasty/bready/doughy); clean; malt and hops balanced. Flavor: moderate balanced malt and hops, medium noticeable bitterness, full palate, medium-dry finish; mineral character as roundness and dry flinty finish; background sulfate optional. Mouthfeel: medium to medium-full, medium carbonation, smooth; slight warmth in stronger versions.", "Mineral water (high sulfate, carbonate, chloride); Pils malt; German/Czech hops; German lager yeast; decoction traditional.", "Comparison: fewer finishing hops and more body than Pils; more bitter and drier than Helles; stronger, drier, less hoppy than Czech Premium Pale.", "Commercial: DAB Dortmunder Export, Dortmunder Kronen, Schonramer Gold, Chuckanut Export Dortmunder, Landshuter Edel Hell, Mullerbrau Export Gold."]}, {"code": "5D", "name": "German Pils", "cat": 5, "catName": "Pale Bitter European Beer", "stats": {"OG": [1.044, 1.05], "FG": [1.008, 1.013], "IBU": [22.0, 40.0], "SRM": [2.0, 4.0], "ABV": [4.4, 5.2]}, "text": ["Aroma: mod to mod-high floral/spicy/herbal hops; low-med grainy/doughy malt with honey/toasted cracker; clean. Flavor: malt quickly overtaken by hop flavor and bitterness, dry crisp finish; medium to high lingering bitterness; mineral water lengthens dryness; always bitter-balanced. Mouthfeel: medium-light, medium to high carbonation, may be flinty/minerally.", "Continental Pils malt, German hops, clean German lager yeast. Paler, drier, sharper, more bitter going north; Bavarian versions softer.", "Comparison: lighter, drier, crisper, more bitter, more carbonated than Czech Premium Pale; more hop/malt/bitterness than Intl Pale Lager; more hop and drier than Helles.", "Commercial: Jever Pilsener, Konig Pilsener, Trumer Pils, Rothaus Pils, Schonramer Pils, Paulaner Pils, Bierstadt Slow Pour Pils, ABK Pils Anno 1907."]}, {"code": "6A", "name": "Marzen", "cat": 6, "catName": "Amber Malty European Lager", "stats": {"OG": [1.054, 1.06], "FG": [1.01, 1.014], "IBU": [18.0, 24.0], "SRM": [8.0, 17.0], "ABV": [5.6, 6.3]}, "text": ["Aroma: moderate rich bready, toasty malt, light bread crust; very low hop optional; clean lager; caramel-sweet, biscuity-dry, roasted aromas inappropriate. Flavor: moderate to high rich malt, initial sweetness but moderately-dry to dry finish; bready/toasty complexity; moderate bitterness; low-none hop flavor; sweet caramel, dry biscuit, roast inappropriate. Mouthfeel: medium, smooth, creamy; medium carbonation; fully attenuated, not cloying.", "Munich-malt emphasis, finest base malts; decoction traditional; German lager yeast. Orange-amber to reddish-copper (not golden).", "Comparison: not as strong/rich as Dunkles Bock; more malt depth/body and slightly fewer hops than Festbier; less hoppy but as malty as Czech Amber.", "Commercial: Paulaner Oktoberfest, Hacker-Pschorr Oktoberfest Marzen, Weltenburg Kloster Anno 1050, Hofmark Marzen, Saalfelder Ur-Saalfelder."]}, {"code": "6B", "name": "Rauchbier", "cat": 6, "catName": "Amber Malty European Lager", "stats": {"OG": [1.05, 1.057], "FG": [1.012, 1.016], "IBU": [20.0, 30.0], "SRM": [12.0, 22.0], "ABV": [4.8, 6.0]}, "text": ["Aroma: blend of beechwood smoke (smoky/woody/bacon-like, subtle to strong) and malt (low-mod, toasty); smoke and malt often inversely related; low hop optional; clean. Flavor: follows aroma, smoke low to high yet harmonious with Marzen-like toasty malt; medium-dry to dry finish; moderate balanced bitterness; up to moderate hop flavor; harsh/acrid/burnt/rubbery/creosote smoke inappropriate; ham/bacon ok if not greasy. Mouthfeel: medium, medium to med-high carbonation, smooth; no astringent phenolic harshness.", "Marzen-type grist + sizeable German Rauchmalz (beechwood-smoked Vienna-type); lager yeast; German/Czech hops. Bamberg specialty. Other smoked German styles go to 32A.", "Comparison: Marzen with balanced sweet smoke and somewhat darker color.", "Commercial: Schlenkerla Rauchbier Marzen, Spezial Rauchbier Marzen, Goller Rauchbier, Rittmayer Rauchbier, Cervejaria Bamberg."]}, {"code": "6C", "name": "Dunkles Bock", "cat": 6, "catName": "Amber Malty European Lager", "stats": {"OG": [1.064, 1.072], "FG": [1.013, 1.019], "IBU": [20.0, 27.0], "SRM": [14.0, 22.0], "ABV": [6.3, 7.2]}, "text": ["Aroma: med to med-high rich bready malt, Maillard/toasty; virtually no hop aroma; some alcohol; clean (slight dark fruit allowed). Flavor: med to med-high complex malt dominated by toasty Maillard, some dark caramel; bitterness only supports malt, lingering malty sweetness but well-attenuated; no hop flavor; no roast, burnt or dry biscuit. Mouthfeel: medium to medium-full, mod to mod-low carbonation, alcohol warmth never hot, smooth.", "Munich and Vienna malts, tiny dark roast for color at most, no adjuncts; continental hops; clean lager yeast; decoction important.", "Comparison: darker, richer, less bitter than Helles Bock; less alcohol/richness than Doppelbock; stronger than Marzen; richer, less attenuated, less hoppy than Czech Amber.", "Commercial: Einbecker Ur-Bock Dunkel, Aass Bock, Kneitinger Bock, Schell's Bock, Penn Brewery St. Nikolaus Bock, Lindeboom Bock."]}, {"code": "7A", "name": "Vienna Lager", "cat": 7, "catName": "Amber Bitter European Beer", "stats": {"OG": [1.048, 1.055], "FG": [1.01, 1.014], "IBU": [18.0, 30.0], "SRM": [9.0, 15.0], "ABV": [4.7, 5.5]}, "text": ["Aroma: moderate malt, toasty and malty-rich; floral/spicy hop low to none; clean; significant caramel/biscuit/roast inappropriate. Flavor: soft elegant malt, rich toasty without significant caramel/biscuity/roast; firm bitterness for balanced, fairly dry soft finish; low-none hop flavor. Mouthfeel: med-light to medium, gentle creaminess, moderate carbonation, smooth.", "Best-quality Vienna malt (also Pils/Munich), continental hops, clean German lager yeast; small specialty malt for color. Standard-strength everyday beer.", "Comparison: Marzen-like malt but lighter, slightly more bitter/dry, lower ABV; less rich/malty/hoppy than Czech Amber.", "Commercial: Ottakringer Wiener Original, Schell's Firebrick, Devils Backbone Vienna Lager, Figueroa Mountain Red Lager, Heavy Seas Cutlass, Chuckanut Vienna, Theresianer Vienna."]}, {"code": "7B", "name": "Altbier", "cat": 7, "catName": "Amber Bitter European Beer", "stats": {"OG": [1.044, 1.052], "FG": [1.008, 1.014], "IBU": [25.0, 50.0], "SRM": [9.0, 17.0], "ABV": [4.3, 5.5]}, "text": ["Aroma: malty, baked bread/nutty toasted crust, no roast/chocolate; moderate to mod-high malt; mod-low spicy/peppery/floral hops; very clean fermentation, low to med-low esters optional. Flavor: similar malt; assertive medium to high bitterness; medium-dry to dry, long grainy-bitter malty aftertaste, nutty or bittersweet; light dark-fruit esters possible; medium to low spicy hop; light mineral optional; no roast. Mouthfeel: medium body, smooth, medium to med-high carbonation, low astringency.", "TOP-fermented clean attenuative ale yeast at cool temps, then cold-conditioned; Pils (sometimes Munich) with small crystal/chocolate/black, optionally wheat; Spalt hops traditional; step mash traditional. Dusseldorf. Most examples 25-35 IBU. Sticke/doppelsticke go to Cat 27.", "Comparison: more bitter and malty than Intl Amber Lager; similar in technique/flavor/color to California Common; less alcohol/richness than Dunkles Bock; drier, richer, more bitter than Vienna.", "Commercial: Uerige Altbier, Fuchschen Alt, Diebels Alt, Schumacher Alt, Original Schlussel Alt, Bolten Alt, Schlosser Alt."]}, {"code": "8A", "name": "Munich Dunkel", "cat": 8, "catName": "Dark European Lager", "stats": {"OG": [1.048, 1.056], "FG": [1.01, 1.016], "IBU": [18.0, 28.0], "SRM": [17.0, 28.0], "ABV": [4.5, 5.6]}, "text": ["Aroma: moderate to high malt richness like toasted bread crust with hints of chocolate, nuts, caramel, toffee; malty-rich more than sugary; clean; light hop optional. Flavor: medium to high rich malt as aroma; med-low to medium bitterness, malty balance; soft, not overly sweet, medium-dry finish; no roast/burnt/bitter malt, no harsh dry grain, caramel not sweet. Mouthfeel: medium to medium-full, soft dextrinous, moderate carbonation, smooth, not warming.", "Munich malts (Pils/Vienna ok), light specialty malts; decoction traditional; German hops and lager yeast. Franconian versions more bitter.", "Comparison: less intense/strong than Dunkles Bock; lacks roast and often bitterness of Schwarzbier; richer, more malt-centric, less hoppy than Czech Dark Lager.", "Commercial: Ayinger Altbairisch Dunkel, Ettaler Kloster-Dunkel, Hacker-Pschorr Munchner Dunkel, Hofbrauhaus Dunkel, Weltenburger Kloster Barock-Dunkel, Eittinger Urtyp Dunkel."]}, {"code": "8B", "name": "Schwarzbier", "cat": 8, "catName": "Dark European Lager", "stats": {"OG": [1.046, 1.052], "FG": [1.01, 1.016], "IBU": [20.0, 35.0], "SRM": [19.0, 30.0], "ABV": [4.4, 5.4]}, "text": ["Aroma: low-mod malt (clean/neutral to bready, hint of dark caramel) with hints of roast (dark chocolate/coffee-like, never burnt); mod-low hop optional; clean lager. Flavor: light-mod malt; light-mod roast giving bitter-chocolate but never burnt; med-low to medium bitterness; light-mod spicy/floral/herbal hop; dry finish; some residual sweetness acceptable but not traditional; subtle roast in aftertaste. Mouthfeel: med-light to medium, mod to mod-high carbonation, smooth, no harshness/astringency.", "Munich and Pilsner base, huskless dark roasted malts; German hops; clean lager yeast. Porter-like strong roast is a flaw. \"Black Pils\" is rarely as dark or bitter as that.", "Comparison: vs Dunkel: darker, drier, lighter body, noticeable roast edge; not an American Porter with lager yeast; drier, less malty, less hoppy than Czech Dark Lager.", "Commercial: Kostritzer Schwarzbier, Kulmbacher Monchshof Schwarzbier, Chuckanut Schwarz, Devils Backbone Schwartz Bier, pFriem Schwarzbier, Nuezeller Original Badebier."]}, {"code": "9A", "name": "Doppelbock", "cat": 9, "catName": "Strong European Beer", "stats": {"OG": [1.072, 1.112], "FG": [1.016, 1.024], "IBU": [16.0, 26.0], "SRM": [6.0, 25.0], "ABV": [7.0, 10.0]}, "text": ["Aroma: very strong maltiness, light caramel, up to moderate alcohol; virtually no hop aroma. Dark: rich Maillard, deeply toasted, slight chocolate (never roasted/burnt), mod-low dark fruit (plum, grape, fruit leather). Pale: strong toasty malt, possible light floral/spicy/herbal hop accent. Flavor: very rich malty; moderate to mod-low bitterness letting malt dominate; faint hop flavor optional; malty-sweet palate but attenuated finish (sweetness from low hopping, not incomplete fermentation); clean. Pale: bready/toasty, drier. Mouthfeel: medium-full to full, mod to mod-low carbonation, very smooth, light alcohol warmth never burning.", "Pils/Vienna/Munich malts, occasional dark malt for color; German hops; clean lager yeast; decoction traditional. No upper gravity limit if balance holds. \"-ator\" names (Salvator trademark history).", "Comparison: stronger, richer, fuller version of Dunkles or Helles Bock; pale ones more attenuated, less dark-fruit.", "Commercial: Dark - Paulaner Salvator, Ayinger Celebrator, Spaten Optimator, Weihenstephaner Korbinian, Andechs Doppelbock Dunkel, Troegs Troegenator; Pale - Plank Bavarian Heller Doppelbock, Meinel Doppelbock Hell, Eggenberg Urbock 23, Riegele Auri."]}, {"code": "9B", "name": "Eisbock", "cat": 9, "catName": "Strong European Beer", "stats": {"OG": [1.078, 1.12], "FG": [1.02, 1.035], "IBU": [25.0, 35.0], "SRM": [17.0, 30.0], "ABV": [9.0, 14.0]}, "text": ["Aroma: rich intense malt (bready, toasty, caramel, faint chocolate, dark fruit like plum/grape) with definite alcohol, not harsh/solventy; no hop aroma; clean. Flavor: rich sweet malt balanced by significant alcohol; Maillard, toasty, caramel, dark-fruit esters possible; bitterness just offsets sweetness; no hop flavor; finish rich with dryness from alcohol, not sticky/syrupy. Mouthfeel: full to very full, low carbonation, significant warmth without sharp heat, very smooth/silky; head retention moderate to poor; pronounced legs.", "Made by freeze concentration (\"freeze distillation\") of a doppelbock-like beer, removing ice; concentrates flavors AND any defects; extended lagering afterward to smooth. Concentrated roughly 7-33% by volume. Name refers to process, not alcohol (some Doppelbocks are stronger).", "Comparison: not simply a stronger Doppelbock; not as thick/rich/sweet as Wheatwine.", "Commercial: Kulmbacher Eisbock."]}, {"code": "9C", "name": "Baltic Porter", "cat": 9, "catName": "Strong European Beer", "stats": {"OG": [1.06, 1.09], "FG": [1.016, 1.024], "IBU": [20.0, 40.0], "SRM": [17.0, 30.0], "ABV": [6.5, 9.5]}, "text": ["Aroma: rich malt (caramel, toffee, nuts, deep toast, licorice); complex moderate alcohol/ester (plums, prunes, raisins, cherries, currants, sometimes vinous/Port-like); dark chocolate/coffee/molasses, never burnt; no hops; no sourness. Flavor: rich malt, dried-fruit esters, alcohol; prominent but smooth Schwarzbier-like roast stopping short of burnt; malty-sweet start, darker malt dominates, dryish finish with coffee/licorice/dried fruit; med-low to medium bitterness; hop flavor none to med-low; clean. Mouthfeel: quite full-bodied and smooth, well-aged warmth, medium to med-high carbonation.", "Generally LAGER yeast (cold-fermented if ale yeast, e.g., Russia); debittered dark malt; Munich/Vienna base; continental hops; crystal/adjuncts possible. Historically top-fermented; modern name since 1990s. Most commercial 7-8.5% ABV.", "Comparison: combines Doppelbock body/richness, English Porter dark malt, Schwarzbier roast, Old Ale alcohol/fruitiness; far less roasted and often weaker than Imperial Stout.", "Commercial: Zywiec Porter, Okocim Mistrzowski Porter, Baltika #6 Porter, Sinebrychoff Porter, Aldaris Mezpils Porteris, Devils Backbone Danzig."]}, {"code": "10A", "name": "Weissbier", "cat": 10, "catName": "German Wheat Beer", "stats": {"OG": [1.044, 1.053], "FG": [1.008, 1.014], "IBU": [8.0, 15.0], "SRM": [2.0, 6.0], "ABV": [4.3, 5.6]}, "text": ["Aroma: moderate to strong banana (esters) and clove (phenols), usually stronger than malt; light-mod bready/doughy wheat; light vanilla optional; light hops optional; bubblegum, sourness, smoke = faults. Flavor: low to moderately strong banana and clove, balanced; soft bready/doughy wheat; very low to mod-low bitterness; relatively dry finish (perceived sweetness from low bitterness, sweet/heavy finish is a flaw). Mouthfeel: med-light to medium, fluffy creamy then spritzy; high to very high carbonation.", "Weizen yeast, cool fermentation; wheat at least half of grist; Pils malt; decoction traditional. Hefeweizen; Kristall = filtered. Entrant may say if yeast roused.", "Comparison: vs American Wheat has banana/clove and less bitterness; vs Dunkles Weissbier paler, less malt richness.", "Commercial: Weihenstephaner Hefeweissbier, Schneider Weisse Original, Ayinger Brau-Weisse, Hacker-Pschorr Hefeweissbier, Hofbrauhaus Munchner Weisse, Distelhauser Hell Weizen."]}, {"code": "10B", "name": "Dunkles Weissbier", "cat": 10, "catName": "German Wheat Beer", "stats": {"OG": [1.044, 1.057], "FG": [1.008, 1.014], "IBU": [10.0, 18.0], "SRM": [14.0, 23.0], "ABV": [4.3, 5.6]}, "text": ["Aroma: moderate banana and clove balanced with malt; light-mod bready/doughy wheat with caramel/bread crust/richer malt; low-mod vanilla optional; bubblegum, sourness, smoke = faults. Flavor: low to moderately strong banana/clove (malt may mask clove); low to med-high wheat with caramel/toast/bread crust; no strong roast (touch of roasty dryness ok); very low to low bitterness; relatively dry finish. Mouthfeel: med-light to medium-full, fluffy-creamy, moderate to high carbonation.", "Weizen yeast, cool fermentation; wheat at least half; Munich/Vienna/Pils malt plus dark/caramel wheat or color malt; decoction traditional.", "Comparison: Weissbier yeast/wheat with Munich Dunkel malt richness; banana-clove less apparent than Weissbier; similar yeast to Roggenbier without rye.", "Commercial: Weihenstephaner Hefeweissbier Dunkel, Franziskaner Hefe-Weisse Dunkel, Ayinger Ur-Weisse, Ettaler Benediktiner Weissbier Dunkel, Tucher Dunkles Hefe Weizen, Hirsch Dunkel Weisse."]}, {"code": "10C", "name": "Weizenbock", "cat": 10, "catName": "German Wheat Beer", "stats": {"OG": [1.064, 1.09], "FG": [1.015, 1.022], "IBU": [15.0, 30.0], "SRM": [6.0, 25.0], "ABV": [6.5, 9.0]}, "text": ["Aroma: medium-high to high malty richness with bready/grainy wheat; medium-low to med-high weizen yeast (banana, clove); vanilla optional; no hops; low-mod alcohol, not hot; bubblegum, sourness, smoke = faults. Dark: deeply toasted/Maillard like Dunkles Bock/dark Doppelbock, caramel, dark fruit (plum, prune, raisin) esp. with age. Pale: grainy-sweet bready toasty like Helles Bock/pale Doppelbock. Flavor: medium-high to high malt richness with bready wheat; low-mod banana and spice; no hop flavor; low to med-low bitterness, slightly sweet impression but finishes dry; complexity improves with age. Mouthfeel: medium-full to full, soft, fluffy/creamy, mild warmth, moderate to high carbonation.", "Weizen yeast, cool fermentation; wheat at least half; Munich/Vienna/Pils malt; sparing color malts; decoction traditional. Bock to Doppelbock strength. Late- earthy/resiny/fruity/floral hop flavor; low-medium malt, dry finish; optional low-mod caramel/toffee. Mouthfeel: med-light to medium, low carbonation (bottled moderate).", "Pale/amber/crystal malts, most contain sugar, touch of caramel/dark malt, corn/wheat possible; English finishing hops; British yeast.", "Comparison: more malt flavor, alcohol and better ingredients than Ordinary; less alcohol than Strong Bitter; more caramel/base malt and color than British Golden Ale.", "Commercial: Fuller's London Pride, Timothy Taylor Landlord, Adnams Southwold Bitter, Harvey's Sussex Best Bitter, Surrey Hills Shere Drop, Salopian Darwin's Origin."]}, {"code": "11C", "name": "Strong Bitter", "cat": 11, "catName": "British Bitter", "stats": {"OG": [1.048, 1.06], "FG": [1.01, 1.016], "IBU": [30.0, 50.0], "SRM": [8.0, 18.0], "ABV": [4.6, 6.2]}, "text": ["Aroma: hop aroma mod-high to mod-low (floral/earthy/resiny/fruity); medium to med-high malt aroma, optional low-mod caramel; med-low to med-high fruity esters; generally no diacetyl (very low allowed). Flavor: medium to med-high bitterness with supporting bready/biscuity/nutty/toasty malt, optional caramel/toffee; moderate to mod-high hop flavor; mod-low to high esters; optional low alcohol; medium-dry to dry finish; hops must not totally dominate malt. Mouthfeel: med-light to medium-full, low-moderate carbonation, slight alcohol warmth in stronger ones.", "Pale/amber/crystal malts, touch of black for color, sugar/corn/wheat possible; English finishing hops; British yeast; Burton versions use medium-high sulfate water (dryness, minerally/sulfury note).", "Comparison: more evident malt/hop flavors and alcohol than Best Bitter; overlaps British Strong Ales but paler and more bitter; more malt (caramel) and esters than American Pale Ale. \"ESB\" is a Fuller's trademark in the UK; US ESBs are malty, reddish, standard-strength.", "Commercial: Bass Ale, Bateman's Triple XB, Robinsons Trooper, Samuel Smith's Organic Pale Ale, Shepherd Neame Bishop's Finger, Summit Extra Pale Ale."]}, {"code": "12A", "name": "British Golden Ale", "cat": 12, "catName": "Pale Commonwealth Beer", "stats": {"OG": [1.038, 1.053], "FG": [1.006, 1.012], "IBU": [20.0, 45.0], "SRM": [2.0, 5.0], "ABV": [3.8, 5.0]}, "text": ["Aroma: hop mod-low to mod-high, any variety (English floral/herbal/earthy or American citrus; often single hop showcased); low bready malt, NO caramel; med-low to low fruitiness from hops rather than esters; low diacetyl optional. Flavor: medium to med-high bitterness; moderate to mod-high hop flavor (citrus increasingly common); med-low to low bready/slightly biscuity malt; caramel absent; mod-low to low esters; medium-dry to dry finish; low diacetyl optional. Mouthfeel: light to medium, low-moderate carbonation on draught; stronger versions slight warmth.", "Low-color pale or lager malt as blank canvas; sugar/corn/wheat possible; English or American citrusy hops; somewhat clean British yeast. Served colder than bitters; golden bitter/summer ale/British blonde.", "Comparison: closest to American Pale Ale but often lower ABV with British ingredients; no caramel and fewer esters than British Bitters; hoppiness between Blonde Ale and APA.", "Commercial: Hop Back Summer Lightning, Fuller's/Spitfire Golden Ale (Shepherd Neame Spitfire Golden Ale), Adnams Explorer, Crouch Vale Brewers Gold, Oakham JHB, Golden Hill Exmoor Gold."]}, {"code": "12B", "name": "Australian Sparkling Ale", "cat": 12, "catName": "Pale Commonwealth Beer", "stats": {"OG": [1.038, 1.05], "FG": [1.004, 1.006], "IBU": [20.0, 35.0], "SRM": [4.0, 7.0], "ABV": [4.5, 6.0]}, "text": ["Aroma: soft, clean, balanced esters/hops/malt/yeast at moderate to low intensity; esters pears/apples, maybe light banana; hops earthy/herbaceous or iron-like Pride of Ringwood note; malt neutral grainy to lightly bready, no caramel; fresh examples may be slightly yeasty/sulfury. Flavor: medium to low rounded grainy/bready malt, medium to med-high bitterness rising mid-palate; no caramel; highly attenuated dry crisp finish with lingering bitterness but impression of fullness; medium to med-high earthy/herbal/peppery/iron-like hop flavor (not floral); pear/apple esters; banana optional but never dominant; may be minerally/sulfury. Mouthfeel: high to very high carbonation (spritzy, carbonic bite), medium to medium-full body (fuller if poured with yeast); no residual sweetness.", "Lightly kilned Australian 2-row (lager malt ok), crystal only for color, modern examples no adjuncts (cane sugar for priming only); Cluster/Goldings historically, Pride of Ringwood since mid-1960s; highly attenuative Burton-type (Australian) yeast; low carbonate/moderate sulfate water. Naturally carbonated, bottle-conditioned; yeast roused when poured gives cloudy look.", "Comparison: like English Pale Ale but far more carbonated, less caramel, fewer late hops, showcases signature yeast/hop; more bitter than IBUs suggest.", "Commercial: Coopers Sparkling Ale."]}, {"code": "12C", "name": "English IPA", "cat": 12, "catName": "Pale Commonwealth Beer", "stats": {"OG": [1.05, 1.07], "FG": [1.01, 1.015], "IBU": [40.0, 60.0], "SRM": [6.0, 14.0], "ABV": [5.0, 7.5]}, "text": ["Aroma: moderate to mod-high hop (floral, spicy-peppery, citrus-orange); slight dry-hop ok; med-low to medium bready/biscuity malt, optional mod-low caramel/toasty; low-mod fruitiness; optional light sulfur. Flavor: medium to high hop flavor like aroma; moderate to assertive bitterness; medium-low to medium bready malt (biscuit, toast, toffee, caramel optional); med-low to medium fruitiness; medium-dry to very dry finish, bitterness may linger but not harsh; hop-leaning balance; high-sulfate water adds minerally dry finish and sulfur. Mouthfeel: smooth, med-light to medium, medium to med-high carbonation, no hop astringency; stronger ones warming.", "Pale ale malt; English finishing hops; attenuative British ale yeast; refined sugar possible; optional Burton sulfate. Should NOT show oak or Brett despite cask shipping. Per CAMRA ~3.5% \"IPAs\" not true to style.", "Comparison: more late hops, less fruitiness and caramel than British pale ales and Bitters; less hop intensity and more malt than American IPA.", "Commercial: Worthington White Shield, Thornbridge Jaipur, Meantime London IPA, Fuller's Bengal Lancer, Marston's Old Empire, Berkshire Lost Sailor."]}, {"code": "13A", "name": "Dark Mild", "cat": 13, "catName": "Brown British Beer", "stats": {"OG": [1.03, 1.038], "FG": [1.008, 1.013], "IBU": [10.0, 25.0], "SRM": [14.0, 25.0], "ABV": [3.0, 3.8]}, "text": ["Aroma: low-mod malt, maybe fruitiness, wide malt expression (caramel, toffee, grainy, toasted, nutty, chocolate, light roast); low earthy/floral hop optional; very low diacetyl optional. Flavor: generally malty, wide range of malt/yeast flavors (caramel, toffee, toast, nutty, chocolate, coffee, roast, licorice, plum, raisin) on bready/biscuity/toasty base; sweet to dry finish; low to moderate bitterness; moderate fruity esters, low hop flavor, low diacetyl optional. Mouthfeel: light to medium, low to med-low carbonation, roasty versions slightly astringent; should not be flat, watery or thin.", "Pale British base malts (dextrinous), crystal, dark malts or dark sugars, flaked maize possible, may use brewer's caramel; characterful British yeast; any hops (muted). Usually ~3.2% on cask; 4%+ versions for export/seasonal.", "Comparison: some versions resemble lower-gravity modern English Porter; much less sweet than London Brown Ale.", "Commercial: Moorhouse Black Cat, Theakston Traditional Mild, Greene King XX Mild, Hobson's Champion Mild, Mighty Oak Oscar Wilde, Brain's Dark."]}, {"code": "13B", "name": "British Brown Ale", "cat": 13, "catName": "Brown British Beer", "stats": {"OG": [1.04, 1.052], "FG": [1.008, 1.013], "IBU": [20.0, 30.0], "SRM": [12.0, 22.0], "ABV": [4.2, 5.9]}, "text": ["Aroma: light sweet malt with toffee, nutty, light chocolate, light to heavy caramel; light floral/earthy hop; light fruity not dominant. Flavor: gentle to moderate malt sweetness, light to heavy caramel, medium to dry finish; nutty/toasted/biscuity/toffee/light chocolate; medium to medium-low bitterness; even to malt-focused balance; low hop flavor and low-mod esters optional. Mouthfeel: med-light to medium, medium to med-high carbonation.", "British mild or pale ale malt with caramel malts, small amounts darker malts (chocolate) for color/nuttiness; English hops most authentic. No strongly roasted flavors. London Brown Ale (sweeter, 27 Historical) is a separate style.", "Comparison: more malty balance and darker-grain flavor than British Bitters; stronger than Dark Mild; less roast than English Porter; stronger and much less sweet than London Brown Ale.", "Commercial: Newcastle Brown Ale, Samuel Smith's Nut Brown Ale, Riggwelter Yorkshire Ale, AleSmith Nut Brown Ale, Cigar City Maduro Brown Ale, Maxim Double Maxim."]}, {"code": "13C", "name": "English Porter", "cat": 13, "catName": "Brown British Beer", "stats": {"OG": [1.04, 1.052], "FG": [1.008, 1.014], "IBU": [18.0, 35.0], "SRM": [20.0, 30.0], "ABV": [4.0, 5.4]}, "text": ["Aroma: moderate to mod-low bready/biscuity/toasty malt with mild roast often chocolate; caramel, nuts, toffee possible; up to moderate floral/earthy hops; moderate fruity esters optional but desirable; low diacetyl optional. Flavor: moderate bready/biscuity/toasty malt with mild-mod chocolate roastiness, often caramel/nutty/toffee, possibly coffee/licorice; not burnt or harshly roasted (small bitter-chocolate complexity ok); up to moderate earthy/floral hop; low-mod fruity esters; med-low to medium bitterness; fairly dry to slightly sweet finish; moderately-low diacetyl optional. Mouthfeel: med-light to medium, mod-low to mod-high carbonation, light-moderate creamy texture.", "Dark-producing grist (chocolate/roasted malt, caramel malt, sugars); London-type often uses brown malt; British ale yeast. Called simply \"Porter\" in Britain. Historical re-creations go to Cat 27.", "Comparison: softer, sweeter, more caramelly, lower gravity/ABV than American Porter (which is also hoppier); more substance and roast than British Brown Ale; higher gravity than Dark Mild.", "Commercial: Fuller's London Porter, Samuel Smith Taddy Porter, Burton Bridge Burton Porter, Bateman's Salem Porter, RCH Old Slug Porter, Nethergate Old Growler Porter."]}, {"code": "14A", "name": "Scottish Light", "cat": 14, "catName": "Scottish Ale", "stats": {"OG": [1.03, 1.035], "FG": [1.01, 1.013], "IBU": [10.0, 20.0], "SRM": [17.0, 25.0], "ABV": [2.5, 3.3]}, "text": ["Aroma: low-med caramel/toffee, toasty-sugary (biscuit, graham cracker, butterscotch); light pome fruit and light English hops allowed.", "Flavor: medium toasty-bready malt with caramel/toffee, slightly roasty dry finish; clean; bitterness just enough to avoid cloying.", "Mouthfeel: med-low to medium body; low-mod carbonation; may be creamy.", "Key: clean yeast, light esters OK, light English hop OK; no smoke/peat; pale malt + colour malt/sugar/corn/crystal; soft water. Usually draught, rare.", "Comparison: darker and weaker than other Scottish ales; strength like low-end dark mild but different balance.", "Examples: Belhaven Best, McEwan's 60."]}, {"code": "14B", "name": "Scottish Heavy", "cat": 14, "catName": "Scottish Ale", "stats": {"OG": [1.035, 1.04], "FG": [1.01, 1.015], "IBU": [10.0, 20.0], "SRM": [12.0, 20.0], "ABV": [3.3, 3.9]}, "text": ["Aroma: med-low to medium caramel/toffee, toasty-sugary; light pome fruit and English hop allowed.", "Flavor: same profile as Light (toasty-bready, caramel/toffee, light roasty dry finish), clean.", "Mouthfeel: med-low to medium body; low-mod carbonation; maybe creamy.", "Key: clean fermentation; light esters/hops OK; no smoke; soft water.", "Comparison: lighter colour and stronger than Light; similar strength to ordinary bitter, different balance.", "Examples: McEwan's 70, Orkney Raven Ale."]}, {"code": "14C", "name": "Scottish Export", "cat
