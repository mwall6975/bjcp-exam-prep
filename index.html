more body/richness/malt complexity than Irish Stout; black not brown.", "Examples: Guinness Extra Stout, O'Hara's Leann Follain, Porterhouse XXXX, Sheaf Stout."]}, {"code": "16A", "name": "Sweet Stout", "cat": 16, "catName": "Dark British Beer", "stats": {"OG": [1.044, 1.06], "FG": [1.012, 1.024], "IBU": [20.0, 40.0], "SRM": [30.0, 40.0], "ABV": [4.0, 6.0]}, "text": ["Aroma: mild roasted grain, coffee/chocolate; cream-like sweetness; fruitiness low to mod-high; low diacetyl optional; low floral/earthy hop optional.", "Flavor: roasted coffee/chocolate dominate; low-mod fruity esters; moderate bitterness; medium to high sweetness lasting into finish (quite sweet to moderately dry); low diacetyl optional; low hop optional.", "Mouthfeel: medium-full to full, creamy; low-mod carbonation; high residual sweetness.", "Key: lactose commonly added (unfermentable sweetness; \"milk/cream stout\" names no longer legal in England); pale malt + dark malts/grains; adjuncts OK; mild not burnt roast; early 1900s invalid/tonic stout.", "Comparison: much sweeter, less bitter than other stouts (except Tropical); roast mild not burnt; like Oatmeal Stout but sweeter.", "Examples: Bristol Beer Factory Milk Stout, Firestone Nitro Merlin Milk Stout, Left Hand Milk Stout, Lancaster Milk Stout, Mackeson's XXX Stout, Marston's Oyster Stout."]}, {"code": "16B", "name": "Oatmeal Stout", "cat": 16, "catName": "Dark British Beer", "stats": {"OG": [1.045, 1.065], "FG": [1.01, 1.018], "IBU": [25.0, 40.0], "SRM": [22.0, 40.0], "ABV": [4.2, 5.9]}, "text": ["Aroma: mild grainy roasty coffee with light malty sweetness (coffee-and-cream); fruitiness low to med-high; med-low earthy/floral hop optional; light nutty oat optional; med-low diacetyl optional but typically absent.", "Flavor: mild roasted coffee/milk chocolate, low to mod-high fruit; oats toasty/nutty/grainy; medium bitterness; medium-sweet to medium-dry finish; malty-roasty-nutty aftertaste; hop flavor med-low optional; diacetyl typically absent.", "Mouthfeel: medium-full to full, smooth/silky/velvety, sometimes oily from oats; creamy; medium to med-high carbonation; stronger may warm.", "Key: noticeable oats (5-20%+ oatmeal or malted oats), not symbolic; pale/caramel/chocolate malts and roasted grains; hops mainly bittering; English ale yeast; American versions hoppier, less sweet, less fruity.", "Comparison: cross between Irish Extra Stout and Sweet Stout with oats; sweeter ones like Sweet Stout with oats instead of lactose, drier like a nuttier Irish Extra Stout; emphasises body/mouthfeel.", "Examples: Anderson Valley Barney Flats, St-Ambroise Oatmeal Stout, Samuel Smith Oatmeal Stout, Broughton Stout Jock, Summit Oatmeal Stout, Young's London Stout."]}, {"code": "16C", "name": "Tropical Stout", "cat": 16, "catName": "Dark British Beer", "stats": {"OG": [1.056, 1.075], "FG": [1.01, 1.018], "IBU": [30.0, 50.0], "SRM": [30.0, 40.0], "ABV": [5.5, 8.0]}, "text": ["Aroma: moderate-high sweetness prominent; mod-high coffee/chocolate roast (not burnt); medium-high fruitiness; molasses, licorice, burnt sugar, dried fruit, vinous; clean alcohol in stronger; low hop and low diacetyl optional.", "Flavor: quite sweet with smooth dark grain; restrained med-low to medium bitterness; smooth roast (coffee/chocolate) moderated by sweet finish; no burnt/harsh bite; mod-high fruity esters; dark rum/molasses/burnt sugar; low hop optional; med-low diacetyl optional.", "Mouthfeel: medium-full to full, smooth creamy; warming not hot; moderate to mod-high carbonation.", "Key: scaled-up sweet stout; \"tropical\" refers to origin/market, not tropical-fruit hops; adjuncts/sugar to boost gravity; typically warm-fermented lager yeast; hops for bittering only.", "Comparison: scaled-up Sweet Stout with more fruit; like some Imperial Stouts but without bitterness/burnt roast/late hops and lower ABV; far sweeter, less hoppy than American Stout; sweeter and less bitter than same-gravity Foreign Extra Stout.", "Examples: ABC Extra Stout, Bahamian Strong Back Stout, Dragon Stout, Jamaica Stout, Lion Stout, Royal Extra Stout."]}, {"code": "16D", "name": "Foreign Extra Stout", "cat": 16, "catName": "Dark British Beer", "stats": {"OG": [1.056, 1.075], "FG": [1.01, 1.018], "IBU": [50.0, 70.0], "SRM": [30.0, 40.0], "ABV": [6.3, 8.0]}, "text": ["Aroma: moderate-high roast (coffee, dark chocolate, lightly burnt grain); low-med fruit; may be sweet, molasses, licorice, dried fruit, vinous; subtle clean alcohol; low earthy/herbal/floral hop optional; low diacetyl optional.", "Flavor: moderate-high roast without sharp bite; low-med esters; medium to high bitterness; moderately dry finish; moderate earthy/herbal/floral hop optional; med-low diacetyl optional.", "Mouthfeel: medium-full to full, smooth/sometimes creamy; warming not hot; moderate to mod-high carbonation.", "Key: strong export stout (heavier hopped, longer shelf life; historic long maturation maybe with Brett); pale + dark roasted malts/grains, historically brown/amber malt; typically English hops for bittering; adjuncts/sugar OK. Also called Foreign/Export Stout.", "Comparison: like Irish Extra Stout balance but more alcohol; smaller than Imperial Stout; lacks American Stout's strong bitterness and late hops; same gravity as Tropical but drier and more bitter.", "Examples: Coopers Best Extra Stout, Guinness Foreign Extra Stout, The Kernel Export Stout London 1890, La Cumbre Malpais, Pelican Tsunami Export, Ridgeway Foreign Export, Southwark Old Stout."]}, {"code": "17A", "name": "British Strong Ale", "cat": 17, "catName": "Strong British Ale", "stats": {"OG": [1.055, 1.08], "FG": [1.015, 1.022], "IBU": [30.0, 60.0], "SRM": [8.0, 22.0], "ABV": [5.5, 8.0]}, "text": ["Aroma: malty-sweet with fruity esters; dried fruit, caramel, nuts, toffee; some alcohol OK but not hot/solventy; hops vary (earthy, resiny, fruity, floral).", "Flavor: medium-high rich malt (nutty, toffee, caramel; light chocolate in darker); sugar complexity; malty but may be well hopped; moderate fruity esters, dark/dried fruit; finish medium-dry to somewhat sweet; alcohol evident not overwhelming; low diacetyl optional but generally undesirable.", "Mouthfeel: medium to full, chewy; alcohol warmth welcome; low-mod carbonation; smooth.", "Key: an entry category more than a style (pale malty-hoppy, winter warmers, strong dark milds, small Burton ales); no aged character required; pale malt base with caramel/specialty malts, light dark malt; sugar/maize/flaked barley/wheat adjuncts common; English finishing hops; traditionally bottle-conditioned and cellared.", "Comparison: overlaps Old Ale gravity but not aged; less rich/strong than English Barleywine; stronger than Strong Bitter, Brown Ale, Porter; more specialty malt/sugar character than American Strong Ale.", "Examples: Fuller's 1845, Harvey's Elizabethan Ale, J.W. Lees Moonraker, McEwan's Champion, Samuel Smith's Winter Welcome, Shepherd Neame 1698."]}, {"code": "17B", "name": "Old Ale", "cat": 17, "catName": "Strong British Ale", "stats": {"OG": [1.055, 1.088], "FG": [1.015, 1.022], "IBU": [30.0, 60.0], "SRM": [10.0, 22.0], "ABV": [5.5, 9.0]}, "text": ["Aroma: malty-sweet, fruity esters; dried fruit, vinous, caramel, molasses, toffee, treacle; some alcohol and nutty oxidative notes (Sherry/Port/Madeira) OK; hop aroma not usually present.", "Flavor: medium-high luscious malt (nut, caramel, molasses); light chocolate/roast optional, never prominent; malty-sweet but may be well hopped (bitterness perception falls with age); moderate-high fruity esters, dried-fruit/vinous; finish dry to somewhat sweet; oxidative sherry/port notes with aging OK; alcohol evident; low diacetyl optional.", "Mouthfeel: medium to full, chewy (older may be thinner from continued attenuation); alcohol warmth welcome; low-mod carbonation; light acidity and wood tannin optional.", "Key: defining quality is impression of age (oxidation, leather, vinous): normally faults but acceptable if pleasant and complex, never undrinkable; handling more than brewing; stock/stale ale heritage; composition like British Strong Ale. Old Peculier is unique.", "Comparison: overlaps British Strong Ale and low-end English Barleywine but always aged; split from Barleywine above 7% ABV is arbitrary, defined by greater age.", "Examples: Avery Old Jubilation, Berlina Old Ale, Burton Bridge Olde Expensive, Gale's Prize Old Ale, Greene King Strong Suffolk Ale, Marston Owd Roger, Theakston Old Peculier."]}, {"code": "17C", "name": "Wee Heavy", "cat": 17, "catName": "Strong British Ale", "stats": {"OG": [1.07, 1.13], "FG": [1.018, 1.04], "IBU": [17.0, 35.0], "SRM": [14.0, 25.0], "ABV": [6.5, 10.0]}, "text": ["Aroma: strong bready-toasty malt, high caramel/toffee (breadcrumbs, biscuits, nougat, butterscotch); faint roast sometimes; low-mod dark/dried fruit esters and alcohol; very low earthy/floral/citrus/spicy hops optional.", "Flavor: rich, bready-toasty, often full and sweet, caramel/toffee, balanced by alcohol and hint of grainy roast in finish; medium-low alcohol and esters (plum, raisin); low bitterness; sweet to medium-dry finish; med-low hop flavor optional.", "Mouthfeel: medium-full to full, thick/chewy, sometimes creamy; smooth alcohol warmth desirable; moderate carbonation.", "Key: Scottish pale ale malt, adjuncts OK, crystal or darker grains for colour; NO peat smoke; range of strengths (a ~5% variant and a ~8-9% variant); aka Strong Scotch Ale; descended from Edinburgh ales.", "Comparison: somewhat like English Barleywine but often darker and more caramelly.", "Examples: Belhaven Wee Heavy, Broughton Old Jock, Gordon Highland Scotch Ale, Inveralmond Blackfriar, McEwan's Scotch Ale, Orkney Skull Splitter, Traquair House Ale, Duck-Rabbit Wee Heavy."]}, {"code": "17D", "name": "English Barleywine", "cat": 17, "catName": "Strong British Ale", "stats": {"OG": [1.08, 1.12], "FG": [1.018, 1.03], "IBU": [35.0, 70.0], "SRM": [8.0, 22.0], "ABV": [8.0, 12.0]}, "text": ["Aroma: very rich, strongly malty (caramel in darker, light toffee in paler; bready/toasty); moderate-strong fruit, dark/dried fruit; hops mild to assertive (floral, earthy, tea, marmalade); soft rounded alcohol; sherry/port notes with age.", "Flavor: medium-high rich malty sweetness, complex bread/biscuit/caramel (toffee in pale); medium-high fruitiness; hop flavor/bitterness vary widely (English character), bitterness fades with age; finish moderately dry to moderately sweet; some oxidative/vinous flavors with age OK at noticeable-not-prominent level; pale versions more bitter, attenuated, hoppy.", "Mouthfeel: full, chewy, velvety; smooth non-burning warmth; low-mod carbonation.", "Key: golden amber to dark brown, not black/opaque; British pale and crystal malts, limited dark malts, brewing sugars, English hops, British yeast; changes with age; \"Barley Wine\" is UK spelling.", "Comparison: less hoppy/bitter, maltier, fruitier than American Barleywine; overlaps low-end Old Ale without heavy age; less caramelly and often less sweet than Wee Heavy.", "Examples: Burton Bridge Thomas Sykes Old Ale, Coniston No. 9, Fuller's Golden Pride, Hogs Back A over T, J.W. Lee's Vintage Harvest Ale, Robinson's Old Tom."]}, {"code": "18A", "name": "Blonde Ale", "cat": 18, "catName": "Pale American Ale", "stats": {"OG": [1.038, 1.054], "FG": [1.008, 1.013], "IBU": [15.0, 28.0], "SRM": [3.0, 6.0], "ABV": [3.8, 5.5]}, "text": ["Aroma: light-mod neutral/grainy malt, maybe bread/caramel; low-mod fruitiness optional; low-med hop (any variety; citrus/floral/fruity/spicy common); clean fermentation.", "Flavor: soft initial maltiness, light character malt (bread, toast, biscuit, wheat); caramel usually absent (if any, low-colour/honey); low-med fruity esters optional; light-mod hop flavor, not aggressive; med-low to medium bitterness; balance malt-leaning to even; finish medium-dry to slightly malty; clean.", "Mouthfeel: med-light to medium body; medium to high carbonation; smooth, not heavy.", "Key: generally all-malt, may include wheat/sugar; any hop; clean American, lightly fruity English or Kolsch yeast; lager yeast/cold-conditioned possible (any fermentation). Oxidation can give honey/caramel notes (not malt-derived). aka Golden Ale.", "Comparison: more flavor than American Lager/Cream Ale; less bitter than APA; similar to maltier Kolsch.", "Examples: Firestone Walker 805, Kona Big Wave Golden Ale, Real Ale Fireman's #4, Russian River Aud Blonde, Victory Summer Love, Widmer Citra Summer Blonde."]}, {"code": "18B", "name": "American Pale Ale", "cat": 18, "catName": "Pale American Ale", "stats": {"OG": [1.045, 1.06], "FG": [1.01, 1.015], "IBU": [30.0, 50.0], "SRM": [5.0, 10.0], "ABV": [4.5, 6.2]}, "text": ["Aroma: moderate to mod-high American/New World hops (citrus, floral, pine, resin, spice, tropical/stone fruit, berry, melon; none required); low-mod neutral/grainy malt, low specialty malt (bread, toast, biscuit, caramel); fruity esters optional up to moderate; fresh dry-hop optional.", "Flavor: hop/malt like aroma; caramel absent or restrained; moderate to high bitterness; clean fermentation; esters moderate to none; medium to dry finish; late-hop/bitterness-leaning balance, malt supportive; clean aftertaste.", "Mouthfeel: med-light to medium; moderate-high carbonation; smooth, no harshness.", "Key: neutral pale malt, small specialty malts, American/New World hops, neutral to lightly fruity American or English ale yeast; allow for new hop varieties; often like lower-gravity IPAs.", "Comparison: lighter, cleaner, less caramel than English pale ale; overlaps American Amber in colour but cleaner, less caramel, lighter body, more finishing hops; less bitter/strong than American IPA; maltier/more balanced than Session IPA; hoppier/more bitter than Blonde.", "Examples: Deschutes Mirror Pond, Half Acre Daisy Cutter, Great Lakes Burning River, La Cumbre Acclimated APA, Sierra Nevada Pale Ale, Stone Pale Ale 2.0."]}, {"code": "19A", "name": "American Amber Ale", "cat": 19, "catName": "Amber and Brown American Beer", "stats": {"OG": [1.045, 1.06], "FG": [1.01, 1.015], "IBU": [25.0, 40.0], "SRM": [10.0, 17.0], "ABV": [4.5, 6.2]}, "text": ["Aroma: low-mod American/New World hops (citrus common); mod-low to mod-high malt, usually moderate caramel that may support, balance or mask hops; esters moderate to none.", "Flavor: moderate-high hop flavor; moderate-strong malt: initial sweetness then moderate caramel, minor toasty/biscuity; no dark/roasted malt; moderate to mod-high bitterness; balance somewhat malty to somewhat bitter; esters moderate to none; medium-to-full yet dry finish.", "Mouthfeel: medium to medium-full; medium-high carbonation; smooth; slight warmth in stronger ones.", "Key: neutral pale ale malt with medium-dark crystal; American/New World (often citrusy) hops; neutral to lightly estery yeast; hoppy versions must not clash with caramel; progenitor of Red IPA/Double Red.", "Comparison: darker, more caramel, more body, less bitter than APA; less alcohol/bitterness/hop than Red IPA; less strength/malt/hop than American Strong Ale; less chocolate/dark caramel than American Brown.", "Examples: Anderson Valley Boont Amber, Bell's Amber, Full Sail Amber, North Coast Red Seal, Saint Arnold Amber, Troegs Hopback Amber."]}, {"code": "19B", "name": "California Common", "cat": 19, "catName": "Amber and Brown American Beer", "stats": {"OG": [1.048, 1.054], "FG": [1.011, 1.014], "IBU": [30.0, 45.0], "SRM": [9.0, 14.0], "ABV": [4.5, 5.5]}, "text": ["Aroma: moderate-high herbal/resinous/floral/minty hops; light fruitiness OK; low-mod caramel or toasty malt.", "Flavor: moderately malty, pronounced hop bitterness; toast (not roast) and caramel; low to mod-high rustic traditional American hop flavor (herbal, resinous, floral, minty); dry crisp finish with lingering bitterness and firm grainy malt; light fruity esters OK, otherwise clean.", "Mouthfeel: medium body; medium to med-high carbonation.", "Key: narrowly defined around Anchor Steam; Northern Brewer-type non-citrusy traditional hops (modern citrusy New World hops inappropriate); pale ale malt, small toasted/crystal malt; LAGER yeast fermented warm (55-60 F), California-type strains preferred (some German strains give inappropriate sulfur); historic open shallow coolship fermentation.", "Comparison: superficially like American Amber but toastier malt, always assertive traditional-hop bitterness, warm-fermented lager yeast; less attenuated/carbonated/fruity than Australian Sparkling Ale.", "Examples: Anchor Steam, Steamworks Steam Engine Lager."]}, {"code": "19C", "name": "American Brown Ale", "cat": 19, "catName": "Amber and Brown American Beer", "stats": {"OG": [1.045, 1.06], "FG": [1.01, 1.016], "IBU": [20.0, 30.0], "SRM": [18.0, 35.0], "ABV": [4.3, 6.2]}, "text": ["Aroma: moderate malty-sweet to rich, chocolate/caramel/nutty/toasty; hops low-mod, nearly any type that complements malt (stronger/American hop/dry-hop interpretations optional); esters moderate to very low; dark malt more robust than other browns but not Porter-like.", "Flavor: medium to mod-high malty with chocolate/caramel/nutty/toasty; medium to med-high bitterness; medium to medium-dry finish with malt and hop aftertaste; light-mod hop flavor (maybe citrusy/fruity/tropical); esters very low to moderate; malt and hops about equal; no roasty Porter/Stout character.", "Mouthfeel: medium to medium-full; resiny dry impression in more bitter ones; moderate to mod-high carbonation; stronger may warm.", "Key: pale malt + crystal and chocolate; American hops typical (continental/New World OK); reflects current commercial examples, not early hoppier/stronger homebrew; IPA-strength versions go to 21B Brown IPA.", "Comparison: more chocolate/caramel than APA/Amber, usually less bitter in balance; less bitter/alcoholic/hoppy than Brown IPA; more bitter, hoppier than English Brown, richer malt, higher alcohol, American hop character.", "Examples: Avery Ellie's Brown, Big Sky Moose Drool, Brooklyn Brown, Bell's Best Brown, Smuttynose Old Brown Dog, Telluride Face Down Brown."]}, {"code": "20A", "name": "American Porter", "cat": 20, "catName": "American Porter and Stout", "stats": {"OG": [1.05, 1.07], "FG": [1.012, 1.018], "IBU": [25.0, 50.0], "SRM": [22.0, 40.0], "ABV": [4.8, 6.5]}, "text": ["Aroma: med-light to med-strong roast, often chocolate, light coffee or lightly burnt; background caramel/toffee or malty richness; resiny/earthy/floral hops low to high; moderate fruity esters optional; never sharp/acrid/acidic; always some roast aroma.", "Flavor: moderately strong roast (chocolate, lightly burnt), sometimes caramel/malty richness; medium to high bitterness; dry to medium-sweet finish; low to high resiny/earthy/floral hop flavor that must not clash (dry-hopped versions may be resiny/fresh); moderate esters optional; no acidic bite or acrid/harsh burnt character.", "Mouthfeel: medium to medium-full; mod-low to mod-high carbonation; stronger may warm; slight dark-malt astringency OK, not strong.", "Key: also \"Robust Porter\"; broad style open to interpretation (hoppy or not; American or British feel); pale base, frequent crystal, black/chocolate malts; American bittering hops, US or UK finishing; clean US or characterful English ale yeast.", "Comparison: more bitter, often stronger, more dark-malt character and dryness than English Porter or Pre-Prohibition Porter; less strong/assertive than American Stout.", "Examples: Anchor Porter, Bell's Porter, Deschutes Black Butte, Great Lakes Edmund Fitzgerald, Sierra Nevada Porter, Smuttynose Robust Porter."]}, {"code": "20B", "name": "American Stout", "cat": 20, "catName": "American Porter and Stout", "stats": {"OG": [1.05, 1.075], "FG": [1.01, 1.022], "IBU": [35.0, 75.0], "SRM": [30.0, 40.0], "ABV": [5.0, 7.0]}, "text": ["Aroma: moderate-strong roast (roasted coffee, dark chocolate); burnt/charcoal acceptable at low levels; hop aroma medium to very low, citrusy/resiny; medium esters optional; light alcohol optional; never sharp/acrid/acidic.", "Flavor: moderate to very high roast (coffee, dark/bittersweet chocolate, roasted beans; slightly burnt grounds not prominent); low-med malt sweetness with chocolate/caramel; medium to high bitterness; low to high citrusy/resiny hop flavor; medium to dry finish, occasionally lightly burnt; low esters optional; light smooth alcohol optional.", "Mouthfeel: medium to full, can be creamy; roast astringency OK if not excessive; med-high to high carbonation; light to moderately strong smooth warmth.", "Key: jet black, usually opaque; common American base malts/yeast/hops; varied dark/roasted and caramel malts; low-level adjuncts allowed; once called \"West Coast Stout\"; aggressive American hopping on a strong English/Irish stout.", "Comparison: like a hoppy, bitter, strongly roasted Irish Extra Stout; much more roast and body than Black IPA; bigger/stronger goes to Imperial Stout; stronger and more assertive (dark malt and hops) than American Porter.", "Examples: Avery Out of Bounds Stout, Deschutes Obsidian Stout, Sierra Nevada Stout, Bell's Kalamazoo Stout, Trillium Secret Stairs."]}, {"code": "20C", "name": "Imperial Stout", "cat": 20, "catName": "American Porter and Stout", "stats": {"OG": [1.075, 1.115], "FG": [1.018, 1.03], "IBU": [50.0, 90.0], "SRM": [30.0, 40.0], "ABV": [8.0, 12.0]}, "text": ["Aroma: rich, deep, complex, often intense blend of roast, fruit, hops, alcohol; roast from coffee/bittersweet chocolate/cocoa/licorice/tar/slightly burnt; dark/dried fruit esters (plum, prune, fig, currant, raisin); hops very low to aggressive, English or American; alcohol optional but not sharp/hot/solventy; age adds vinous/port notes, never sourness.", "Flavor: same four components, often more intense than aroma; medium to aggressively high bitterness; maltiness (bread, toast, caramel) supports; dry to moderately sweet finish (changes with age); must not be syrupy/cloying; roast-bitterness-warmth aftertaste.", "Mouthfeel: full to very full, chewy, velvety; background smooth warmth; low-mod carbonation; body may decline with age.", "Key: very dark reddish-brown to jet black, opaque; also \"Russian Imperial Stout\"/RIS; American versions more bitter/roasty/late-hopped, English more specialty-malt and estery, anything between allowed (don't judge as clones); pale malt + significant roasted malt/grain, flaked adjuncts common; American or English ale yeast and hops; ages well; base for many specialty beers.", "Comparison: darker and more roasty than Barleywines with similar alcohol; more complex, wider flavor range than lower-gravity stouts.", "Examples: American: Bell's Expedition Stout, Great Divide Yeti, North Coast Old Rasputin, Oskar Blues Ten Fidy, Sierra Nevada Narwhal. English: Thornbridge Saint Petersburg, Courage Imperial Russian Stout, Le Coq Imperial Extra Double Stout, Samuel Smith Imperial Stout, 2SP The Russian."]}, {"code": "21A", "name": "American IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.056, 1.07], "FG": [1.008, 1.014], "IBU": [40.0, 70.0], "SRM": [6.0, 14.0], "ABV": [5.5, 7.5]}, "text": ["Aroma: prominent to intense American/New World hops (citrus, floral, pine, resin, spice, tropical/stone fruit, berry, melon); low to med-low clean grainy malt; generally clean fermentation, light fruitiness OK; restrained alcohol optional.", "Flavor: medium to very high hop flavor; low to med-low clean grainy malt, maybe light caramel/toast; med-high to very high bitterness; dry to medium-dry finish; hoppy bitter aftertaste; low esters optional; clean alcohol background optional.", "Mouthfeel: med-light to medium body; smooth; medium to med-high carbonation; no harshness.", "Key: oak inappropriate (goes to 33A); clear but light haze allowed; pale base malt, American or English yeast clean/slightly fruity; generally all-malt, sugar acceptable; restrained crystal; any hops OK (new varieties allowed). IPL can enter here if similar. \"West Coast IPA\" = dry, sharply bitter, clear type of 21A.", "Comparison: stronger and hoppier than APA; vs English IPA: less caramel/bread/toast, more American/New World hops, fewer esters, less body, hoppier balance, slightly stronger; less alcohol than Double IPA but similar balance.", "Examples: Bell's Two-Hearted, Cigar City Jai Alai, Fat Heads Head Hunter, Firestone Walker Union Jack, Maine Lunch, Russian River Blind Pig."]}, {"code": "21B", "name": "Specialty IPA", "cat": 21, "catName": "IPA", "text": ["Category note: not a distinct style; IPA balance (hop-forward, bitter, dryish) plus a minor tweak; entrant must declare strength (session ABV 3.0-5.0%, standard 5.0-7.5%, double 7.5-10.0%; default standard) and type (or describe it). Not for classic IPAs with added fruit/spice/wood/smoke (those go to specialty-type categories). Session IPA = 21B with 21A base at session strength; Double IPA is 22A not 21B. Hop aroma required; harshness, heaviness, hop/specialty-ingredient clashes are faults.", "Generic: hop flavor med-low to high; bitterness med-high to very high; malt low to medium; medium-dry to dry finish; smooth, med-light to medium body; medium carbonation."]}, {"code": "21B", "name": "Specialty IPA: Belgian IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.058, 1.08], "FG": [1.008, 1.016], "IBU": [50.0, 100.0], "SRM": [5.0, 8.0], "ABV": [6.2, 9.5]}, "text": ["Aroma: moderate-high American/New World (tropical, melon, stone fruit, citrus, pine) or continental (spicy, herbal, floral) hops, maybe dry-hop; gentle sugary/honey malt, rarely caramel; moderate-high esters (pear, apple, citrus, banana); light clove/pepper optional; light alcohol optional.", "Flavor: moderate fruity and spicy yeast flavors; moderate-high hop flavor; light neutral grainy malt (low toast/caramel/honey optional); moderate-high bitterness; dry to medium-dry finish accentuating bitterness; lingering non-harsh bitterness.", "Mouthfeel: light to medium body; medium to high carbonation (lightens body); light warmth optional.", "Key: Belgian Tripel/Golden Strong yeast + IPA hopping; yeast and hop choice critical (many clash); US versions use American/New World hops, Belgian ones European hops with only pale malt; sugar adjuncts common; dates from mid-2000s.", "Comparison: cross of American/Double IPA with Belgian Golden Strong or Tripel; spicier, stronger, drier, fruitier than American IPA.", "Examples: Brewery Vivant Triomphe, Houblon Chouffe, Green Flash Le Freak, Urthel Hop It."]}, {"code": "21B", "name": "Specialty IPA: Black IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.05, 1.085], "FG": [1.01, 1.018], "IBU": [50.0, 90.0], "SRM": [25.0, 40.0], "ABV": [5.5, 9.0]}, "text": ["Aroma: moderate-high hops (stone fruit, tropical, citrus, resin, pine, berry, melon); very low to moderate malt with possible light chocolate/coffee/toast and background caramel; clean fermentation, light esters OK.", "Flavor: med-low to high hop flavor; low-med malt with restrained chocolate/coffee, not burnt/ashy and not clashing with hops; light caramel/toffee optional; med-high to very high bitterness; dry to slightly off-dry finish, bitter but not harsh, light roast adds dryness; low-mod esters optional.", "Mouthfeel: smooth; med-light to medium body; medium carbonation; light creaminess optional.", "Key: dark brown to black, light haze OK but not murky; DEBITTERED roast malts (Schwarzbier-type restrained roast); any American/New World hop; most are standard strength; strong ones can become hoppy porters; origin Greg Noonan ~1990.", "Comparison: IPA/Double IPA balance with restrained roast; less rich/roasty than American Stout/Porter, less body, smoother, more drinkable.", "Examples: 21st Amendment Back in Black, Duck-Rabbit Hoppy Bunny ABA, Stone Sublimely Self-Righteous."]}, {"code": "21B", "name": "Specialty IPA: Brown IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.056, 1.07], "FG": [1.008, 1.016], "IBU": [40.0, 70.0], "SRM": [18.0, 35.0], "ABV": [5.5, 7.5]}, "text": ["Aroma: moderate to mod-high hops (stone/tropical fruit, citrus, resin, pine, berry, melon); med-low to medium malty-sweet (milk chocolate, cocoa, toffee, nuts, biscuit, dark caramel, toasted bread, dark fruit); clean; light esters/alcohol optional.", "Flavor: medium to high hop flavor; med-low to medium supportive malt; no hop/malt clashes; med-high to high bitterness, no harshness; dry to medium finish, bitter-hoppy-malty aftertaste; no highly roasted/burnt malt; malt should nearly balance hops.", "Mouthfeel: med-light to medium body; smooth; medium to med-high carbonation; light warmth optional.", "Key: reddish-brown to dark brown, not black; medium/dark crystal, lightly roasted chocolate-type malts, intermediate colour malts; sugar incl. brown sugar OK; any American/New World hop that doesn't clash.", "Comparison: stronger, more bitter American Brown with American IPA dryness; less roast than Black IPA, more chocolate than Red IPA.", "Examples: Dogfish Head Indian Brown Ale, Harpoon Brown IPA, Russian River Janet's Brown Ale."]}, {"code": "21B", "name": "Specialty IPA: Brut IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.046, 1.057], "FG": [0.99, 1.004], "IBU": [20.0, 30.0], "SRM": [2.0, 4.0], "ABV": [6.0, 7.5]}, "text": ["Aroma: moderately high to intense bright hops (tropical, stone fruit, citrus, white grape; NOT grassy/vegetal/herbal); subtle neutral malt, never caramelly or corny-sweet; light clean alcohol optional; very clean fermentation, not yeasty.", "Flavor: high to very high hop flavor; low to very low neutral malt, no caramel; perceived bitterness low to very low (bone-dry, very high carbonation); neutral to slightly fruity fermentation; NO diacetyl; dry to very dry finish, fresh hoppy aftertaste, clean bitterness.", "Mouthfeel: light to very light body; spritzy high to very high carbonation (sparkling-wine-like); no hop astringency; alcohol warmth never hot.", "Key: very pale straw to light gold, crystal clear (touch of haze OK), massive rocky white head; pilsner/very pale malt with up to 40% adjuncts; no crystal malt or lactose; enzymes (amyloglucosidase) for very low FG (misuse can cause diacetyl = flaw); oil-heavy modern hops via late/post-boil hopping; neutral yeast; origin 2017 San Francisco.", "Comparison: less malt, bitterness and colour than American IPA, much drier and more carbonated; aroma/flavor like Hazy IPA but dry with little haze; pale/dry/carbonated like Belgian Golden Strong but weaker and no Belgian yeast.", "Examples: Drake's Brightside Extra Brut IPA, Fair State The Brut Squad, Ommegang Brut IPA."]}, {"code": "21B", "name": "Specialty IPA: Red IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.056, 1.07], "FG": [1.008, 1.016], "IBU": [40.0, 70.0], "SRM": [11.0, 17.0], "ABV": [5.5, 7.5]}, "text": ["Aroma: moderate-strong hops (stone/tropical fruit, citrus, resin, pine, berry, melon); med-low to medium malty-sweet (medium-dark caramel, toffee, toasted bread, dark fruit); clean; light esters/alcohol optional.", "Flavor: medium to very high hop flavor; med-low to medium supportive malt; no clashes; med-high to very high bitterness, no harshness; dry to medium finish, bitter-hoppy-malty aftertaste; malt must not overshadow hops.", "Mouthfeel: med-light to medium body; smooth; medium to med-high carbonation; light warmth optional.", "Key: light reddish-amber to dark reddish-copper, clear; IPA grist plus medium/dark crystal, some light-toasty character malts; sugar OK; any American/New World hop.", "Comparison: stronger, hoppier, more bitter American Amber; less malty/sweet than American Strong Ale; drier, lower alcohol, less malty than American Barleywine; less chocolate/caramel than Brown IPA.", "Examples: Avery Hog Heaven, Cigar City Tocobaga Red IPA, Modern Times Blazing World, Troegs Nugget Nectar."]}, {"code": "21B", "name": "Specialty IPA: Rye IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.056, 1.075], "FG": [1.008, 1.014], "IBU": [50.0, 75.0], "SRM": [6.0, 14.0], "ABV": [5.5, 8.0]}, "text": ["Aroma: prominent to intense hops (stone/tropical fruit, citrus, resin, pine, berry, melon); low peppery rye aroma with clean grainy malt; clean fermentation; light esters/alcohol optional.", "Flavor: medium to very high hop flavor; low to med-low supportive malt (light caramel/toast possible); low-moderate grainy, peppery, spicy rye adding to dry finish; med-high to very high bitterness, no harshness; dry bitter hoppy aftertaste.", "Mouthfeel: med-light to medium body; smooth, maybe lightly creamy; medium to med-high carbonation.", "Key: rye malt character must be noticeable (else 21A); generous rye malt; any American/New World hop; NO caraway, NO oak.", "Comparison: drier, slightly spicier and creamier than American IPA with lingering bitterness/spice; lacks Roggenbier's intense rye or Weizen yeast character.", "Examples: Founders Reds Rye, Sierra Nevada Ruthless Rye."]}, {"code": "21B", "name": "Specialty IPA: White IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.056, 1.065], "FG": [1.01, 1.016], "IBU": [40.0, 70.0], "SRM": [5.0, 6.0], "ABV": [5.5, 7.0]}, "text": ["Aroma: moderate esters (orange, grapefruit, apricot, sometimes banana); light spices optional (coriander, orange peel, pepper, clove); med-low to medium hop (stone fruit, citrus, tropical); esters/spice may mask hops; low neutral/grainy/bready malt; light alcohol optional.", "Flavor: moderate-high esters, med-low to med-high hop flavor, light spices; light bready malt; high bitterness; moderately dry refreshing finish.", "Mouthfeel: medium-light body; medium to med-high carbonation; light spice astringency optional.", "Key: pale to deep gold, typically hazy; pale and wheat malts, Belgian Witbier yeast, citrusy American hops; coriander and orange peel optional (spice impression from yeast, additions or both); craft cross of IPA and Witbier.", "Comparison: bitter, hoppy, stronger like American IPA but fruity, spicy, light like Witbier; late hops usually less prominent than American IPA.", "Examples: Lagunitas A Little Sumpin' Sumpin' Ale, New Belgium Accumulation."]}, {"code": "21C", "name": "Hazy IPA", "cat": 21, "catName": "IPA", "stats": {"OG": [1.06, 1.085], "FG": [1.01, 1.015], "IBU": [25.0, 60.0], "SRM": [3.0, 7.0], "ABV": [6.0, 9.0]}, "text": ["Aroma: intense fruity hops (stone fruit, tropical, citrus; not grassy/herbal); clean/neutral/lightly bready malt background, no caramel or toast (absent malt is a fault); neutral to fruity fermentation; yeast and hop esters must not clash; creamy/buttery/acidic aroma inappropriate; light alcohol optional.", "Flavor: high to very high fruity hop flavor; low-medium malt; low to med-high perceived bitterness, masked by fuller body and soft off-dry to medium finish; non-sharp hop aftertaste; shouldn't be sweet (esters + low bitterness can suggest it); alcohol background optional.", "Mouthfeel: medium to medium-full body; medium carbonation; smooth, maybe silky; no harshness; not thick/creamy/viscous, no acidic twang, no raw-starch texture.", "Key: aka New England IPA / NEIPA; straw to light amber, hazy to opaque but \"shine\" not murky (floating hop matter/yeast clumps are faults); haze from polyphenol-protein interaction of dry-hopping, not yeast/starch; more flaked grains, little caramel/specialty malt; fruity American/New World hops; neutral to estery yeast; balanced to chloride-rich water; heavy dry hopping incl. during active fermentation (biotransformation); milkshake/smoothie-like examples out of style; added fruit/lactose/vanilla go to specialty categories.", "Comparison: fuller, softer, more fruit-forward late hops, more restrained bitterness, hazier than American IPA; dry, crisp, at-most-medium-body, high-bitterness examples go in 21A.", "Examples: Belching Beaver Hazers Gonna Haze, Hill Farmstead Susan, Other Half Green Diamonds, Pinthouse Electric Jellyfish, Tree House Julius, Trillium Congress Street, WeldWerks Juicy Bits."]}, {"code": "22A", "name": "Double IPA", "cat": 22, "catName": "Strong American Ale", "stats": {"OG": [1.065, 1.085], "FG": [1.008, 1.018], "IBU": [60.0, 100.0], "SRM": [6.0, 14.0], "ABV": [7.5, 10.0]}, "text": ["Aroma: prominent to intense modern American/New World hops (citrus, floral, pine, resin, spice, tropical/stone fruit, berry, melon); supportive clean neutral-grainy malt; neutral to lightly fruity fermentation; alcohol may show, not solventy.", "Flavor: strong, complex hop flavor; mod-high to very high bitterness, not harsh; low-med soft malt (light caramel/toast OK); dry to medium-dry finish, not sweet/heavy, lingering hoppy bitter aftertaste; low-mod fruitiness optional; light clean alcohol OK.", "Mouthfeel: med-light to medium body, smooth; medium to med-high carbonation; restrained alcohol warmth OK; no hop astringency.", "Key: rarely \"Imperial IPA\"; neutral base malt, sugar adjuncts common, crystal rare; American/New World hops; neutral/lightly fruity yeast; NO oak; often multiple dry-hop additions; drinkability matters.", "Comparison: bigger than English/American IPA in alcohol, bitterness, hoppiness; less malty-rich, lighter body, drier, more hop-dominant than American Barleywine.", "Examples: Columbus Bodhi, Fat Heads Hop Juju, Port Brewing Hop 15, Russian River Pliny the Elder, Stone Ruination Double IPA 2.0, Wicked Weed Freak of Nature."]}, {"code": "22B", "name": "American Strong Ale", "cat": 22, "catName": "Strong American Ale", "stats": {"OG": [1.062, 1.09], "FG": [1.014, 1.024], "IBU": [50.0, 100.0], "SRM": [7.0, 18.0], "ABV": [6.3, 10.0]}, "text": ["Aroma: medium-high American/New World hops (citrus, floral, pine, resin, spice, tropical/stone fruit, berry, melon); moderate-bold malt, medium-dark caramel common, toasty/bready possible, background light roast/chocolate allowed; neutral to moderately fruity; alcohol may show, not solventy.", "Flavor: medium-high malt (caramel, toffee, dark fruit; toasty/bready/rich complexity); light chocolate/roast allowed, not burnt/sharp; med-high to high bitterness; moderate-high hop flavor; low-mod esters; noticeable non-sharp alcohol OK; medium-high malty sweetness, finish somewhat dry to somewhat sweet, not syrupy/cloying; bitter-to-bittersweet aftertaste.", "Mouthfeel: medium to full body; alcohol warmth OK, not excessively hot; light hop astringency allowed; med-low to medium carbonation.", "Key: a grouping by balance rather than a style (modern Double Reds, strong malty-hoppy beers not quite Barleywine); medium amber to light brown; pale base, medium-dark crystal common; American/New World hops; neutral/lightly fruity yeast; kin to historic American stock ales without age character.", "Comparison: not as strong/rich as American Barleywine; more malt-balanced than American/Double IPA; more American hop intensity than British Strong Ale; maltier and fuller than Red IPA.", "Examples: Fat Head's Bone Head, Great Lakes Nosferatu, Oskar Blues G'Knight, Port Brewing Shark Attack Double Red, Stone Arrogant Bastard."]}, {"code": "22C", "name": "American Barleywine", "cat": 22, "catName": "Strong American Ale", "stats": {"OG": [1.08, 1.12], "FG": [1.016, 1.03], "IBU": [50.0, 100.0], "SRM": [9.0, 18.0], "ABV": [8.0, 12.0]}, "text": ["Aroma: strong malt and hop aroma dominate; hops moderate to assertive (American, New World or English; citrusy, fruity, resiny classic); strong grainy/bready/toasty/light caramel or neutral malt richness, typically not dark caramel/roast/deep fruit; low to moderately strong esters and alcohol (below malt and hops); intensities fade with age.", "Flavor: similar to aroma; moderately strong to aggressive bitterness tempered by rich malt; moderate-high hop flavor; low-mod esters; noticeable non-solventy alcohol; mod-low to mod-high malty sweetness, somewhat malty to dry but full finish; age dries and smooths; malty balance but always bitter.", "Mouthfeel: full, chewy, velvety; smooth non-burning alcohol warmth; low to moderate carbonation.", "Key: amber to medium copper (rarely light brown), ruby highlights; pale malt + some specialty, dark malts used very sparingly; American hops typical (many varieties OK); American or English ale yeast; often seasonal/vintage; some now barrel-aged or rebranded as IPA.", "Comparison: more hop bitterness/flavor/aroma than English Barley Wine; typically paler than dark English and darker than golden English versions, without deeper malt flavors; unlike Double IPA, hops not extreme, malt forward, fuller richer body, more residual sweetness (sipping vs drinking).", "Examples: Anchor Old Foghorn, Bell's Third Coast Old Ale, East End Gratitude, Hair of the Dog Doggie Claws, Sierra Nevada Bigfoot."]}, {"code": "22D", "name": "Wheatwine", "cat": 22, "catName": "Strong American Ale", "stats": {"OG": [1.08, 1.12], "FG": [1.016, 1.03], "IBU": [30.0, 60.0], "SRM": [6.0, 14.0], "ABV": [8.0, 12.0]}, "text": ["Aroma: mild hops (any variety); moderate to mod-strong bready wheaty malt, often honey/caramel complexity; light clean alcohol; low-med fruity notes; very low diacetyl optional; banana-clove Weizen yeast character INAPPROPRIATE.", "Flavor: moderate to mod-high bready wheat malt dominates over hops; low-mod toasty/caramel/biscuity/honey notes optional; low-med hop flavor (any variety); moderate to mod-high fruitiness, often dried fruit; low to moderate bitterness; malty to even balance; not syrupy or under-attenuated.", "Mouthfeel: medium-full to full; chewy, luscious, velvety; low to moderate carbonation; light-moderate smooth warmth optional.", "Key: gold to deep amber with garnet/ruby; chill haze allowed; typically American two-row + American wheat, usually 50%+ wheat malt; restrained dark malts; any hops; may be oak-aged; color partly from long boil; roots in American Wheat Beer, no Weizen yeast; first brewed Rubicon 1988; winter seasonal/vintage.", "Comparison: more than a wheat Barleywine (expressive fruit/hops or oak complexity); less hop emphasis than American Barleywine.", "Examples: The Bruery White Oak, Castelain Winter Ale, Perennial Heart of Gold, Two Brothers Bare Tree."]}, {"code": "23A", "name": "Berliner Weisse", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.028, 1.032], "FG": [1.003, 1.006], "IBU": [3.0, 8.0], "SRM": [2.0, 3.0], "ABV": [2.8, 3.8]}, "text": ["Aroma: moderate to mod-high sharp sour dominant; up to moderate fruitiness (lemon, tart apple, peach, apricot), light floral; NO hop aroma; raw bread dough/sourdough impression.", "Flavor: clean lactic sourness dominates (can be strong), complementary doughy/bready wheat; hop bitterness undetectable; never vinegary; bright restrained fruit (apricot-peach, lemon, tart apple); very dry finish; no hop flavor; no THP.", "Mouthfeel: light body but never thin; very high carbonation; no alcohol sensation; crisp acidity.", "Key: straw, clear to somewhat hazy, large dense white head, poor retention; pilsner malt + wheat malt (often at least half); symbiotic co-fermentation of top-fermenting yeast and LAB (Lacto) gives sharpness; blending of ages and cool aging; decoction mash with mash hopping traditional; German scientists consider Brett essential for fruity-floral profile but Brett character restrained (not funky); aged examples may show cider/honey/hay notes; German Schankbier 7-8 P. Fruited/spiced versions go to 29A/30A/29B.", "Comparison: vs Lambic, clean lactic sourness with restrained/sub-threshold Brett, lower alcohol; vs Straight Sour and Catharina Sour, lower gravity and may contain Brett.", "Examples: Bayerischer Bahnhof Berliner Style Weisse, Berliner Berg Berliner Weisse, Brauerei Meierei Weisse, Lemke Berlin Budike Weisse, Schell's Schelltheiss, Urban Chestnut Ku'damm."]}, {"code": "23B", "name": "Flanders Red Ale", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.048, 1.057], "FG": [1.002, 1.012], "IBU": [10.0, 25.0], "SRM": [10.0, 17.0], "ABV": [4.6, 6.5]}, "text": ["Aroma: complex fruity-sour with supporting malt; high fruit (black cherry, orange, plum, red currant, fruit leather); low to med-low vanilla/chocolate/peppery phenol; moderate to high sour; dominant vinegar inappropriate (low-mod acetic OK if balanced); no hop aroma.", "Flavor: moderate to mod-high soft toasty-rich malt; intense fruit; complex moderate-high sourness accentuated by esters (not simple lactic); vinegar not dominant (low-mod acetic OK); as sour rises, malt fades; low-med-low vanilla/chocolate/pepper optional; no hop flavor; restrained bitterness, malt-leaning; acids and tannins give structure; sweetness varies (blended/sweetened versions).", "Mouthfeel: medium body, tannin-enhanced; low to medium carbonation; low-med astringency, prickly acidity; light and crisp though somewhat sweet finish not uncommon.", "Key: deep red/burgundy-brown, wine-like (not literally); aged up to 2 years in large oak foeders; blend of young and old beer, variable sweetening; Vienna/Munich malts, caramel malts, maize, low-alpha continental hops; Sacch + Lacto + Brett; vinegar has 6x total acidity of this style. Fruited versions to 29A. Rodenbach tradition.", "Comparison: less malt-rich than Oud Bruin, often more fruity-tart and acetic.", "Examples: Cuvee des Jacobins Rouge, Duchesse de Bourgogne, New Belgium La Folie, Rodenbach Classic, Rodenbach Grand Cru, Vichtenaar Flemish Ale."]}, {"code": "23C", "name": "Oud Bruin", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.04, 1.074], "FG": [1.008, 1.012], "IBU": [20.0, 25.0], "SRM": [17.0, 22.0], "ABV": [4.0, 8.0]}, "text": ["Aroma: richly malty with fruity esters and aged sourness; medium to med-high esters (raisin, plum, fig, date, orange, black cherry, prune); med-low to med-high malt with caramel/toffee/treacle/chocolate; low spicy-pepper phenols optional; low sour aroma (should not become strongly acetic); no hops; aged ones can show nutty sherry-like oxidation.", "Flavor: malty with fruity complexity, dark caramel/burnt sugar; medium to med-high fruit; slight sourness grows with age plus sherry notes giving \"sweet-and-sour\" profile; not strongly acetic; no hop flavor; restrained bitterness; malty balance; blending/sweetening alters finish.", "Mouthfeel: medium to medium-full body; low to moderate carbonation; no astringency; stronger ones warm.", "Key: dark reddish-brown to brown; long aging and blending of young/old beer; designed to be laid down; Pils malt, dark crystal, maize, small colour malt; low-alpha continental hops; Sacch + Lacto; carbonate/magnesium water; East Flanders (Liefmans); unrelated to Dutch dark lager of same name. Fruited to 29A.", "Comparison: deeper malt (caramel, toffee, chocolate) and darker colour than Flanders Red; less acetic and maltier, fruit more malt-oriented, often higher ABV; unlike Lambic not spontaneous and no wheat.", "Examples: Ichtegem Oud Bruin, Liefmans Goudenband, Liefmans Oud Bruin, Petrus Oud Bruin, pFriem Oud Bruin, Vanderghinste Bellegems Bruin."]}, {"code": "23D", "name": "Lambic", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.04, 1.054], "FG": [1.001, 1.01], "IBU": [0.0, 10.0], "SRM": [3.0, 6.0], "ABV": [5.0, 6.5]}, "text": ["Aroma: young ones sour and fruity; with age barnyard/earthy/goaty/hay/horse-blanket funk; fruit (light citrus, rind, pome, rhubarb) grows complex; malt light bready/grainy/honey/wheat if noticed; no enteric, smoky, cigar-like or cheesy faults; no hops.", "Flavor: young = strong lactic sour with fruit; aged = more balanced/complex with funk; low bready/grainy malt; bitterness below threshold, sourness balances; no hop flavor; dry finish increasing with age; same faults as aroma.", "Mouthfeel: light to med-light body, not watery; medium-high tart puckering without sharp astringency; traditionally virtually uncarbonated (bottled may pick up moderate).", "Key: pale yellow to deep gold, hazy to good; single-batch UNBLENDED beer reflecting house character; usually served young (~6 months) from cask; pilsner malt + unmalted wheat; 3+ year old aged hops as preservative; SPONTANEOUS fermentation (wild yeast/bacteria) in neutral oak; vinegary/cidery = fault; with raw sugar = Faro; complex Brett takes 1+ year.", "Comparison: simpler sourness, less complexity, more batch variation than Gueuze; uncarbonated draught vs Gueuze's bottled, very high carbonation.", "Examples: Cantillon Grand Cru Bruocsella; draught lambic from Boon, De Cam, Cantillon, Drie Fonteinen, Lindemans, Timmermans, Girardin in Brussels cafes."]}, {"code": "23E", "name": "Gueuze", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.04, 1.054], "FG": [1.0, 1.006], "IBU": [0.0, 10.0], "SRM": [5.0, 6.0], "ABV": [5.0, 8.0]}, "text": ["Aroma: moderately sour with complex balanced funk (barnyard, leather, earthy, goaty, hay, horse blanket) plus light-mod fruit (citrus, rind, pome, rhubarb); supportive light bready/grainy/honey malt; light oak OK; no enteric/smoky/cigar/cheesy faults; no hops; complexity valued over intensity.", "Flavor: sour and funky like aroma; low bready/grainy malt; bitterness low to none; no hop flavor; crisp dry finish, tart funky aftertaste; light oak/vanilla/honey OK; not one-dimensionally sour (moderately sour classic); may be aged.", "Mouthfeel: light to med-light body, not watery; low-high tart puckering without sharp astringency; some very light warming; highly carbonated.", "Key: golden, excellent clarity, thick rocky mousse head, effervescent; blend of 1-, 2-, 3-year lambics then cellared (refermentation in bottle); blenders often separate from brewers; \"oude/vieille\" most traditional; some modern producers sweeten (guidelines describe the dry traditional product); vinegary/cidery = fault.", "Comparison: more complex and carbonated than Lambic; sourness not necessarily stronger but more developed wild character.", "Examples: 3 Fonteinen Oud Gueuze, Cantillon Classic Gueuze, Girardin Gueuze 1882 (Black Label), Hanssens Oude Gueuze, Lindemans Gueuze Cuvee Rene, Oude Gueuze Boon."]}, {"code": "23F", "name": "Fruit Lambic", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.04, 1.06], "FG": [1.0, 1.01], "IBU": [0.0, 10.0], "SRM": [3.0, 7.0], "ABV": [5.0, 7.0]}, "text": ["Aroma: specified fruit dominates, blending with Gueuze-type aromatics plus fermented-fruit character.", "Flavor: Gueuze profile plus noticeable fruit; traditional versions dry and tart; modern may be sweetened; fruit flavor fades with age (low to high intensity).", "Mouthfeel: light to med-light body, not watery; low-high tart puckering; light warming possible; carbonation sparkling to nearly still.", "Key: colour reflects fruit; fruit added to barrels (commonly midway through aging) so microbes ferment all fruit sugar; traditional fruit tart cherry (kriek), raspberry (framboise), modern peaches, apricots, grapes; fruit adds acidity and tannin; fermented fruit hard to identify; may be sweetened. Entry: must specify fruit, carbonation (low/med/high) and sweetness (low-none/med/high).", "Comparison: a Gueuze with fruit, not just a sour fruit beer; wild character must be evident.", "Examples: 3 Fonteinen Schaerbeekse Kriek, Cantillon Fou' Foune, Cantillon Lou Pepe Framboise, Cantillon Vigneronne, Hanssens Oude Kriek, Oude Kriek Boon."]}, {"code": "23G", "name": "Gose", "cat": 23, "catName": "European Sour Ale", "stats": {"OG": [1.036, 1.056], "FG": [1.006, 1.01], "IBU": [5.0, 12.0], "SRM": [3.0, 4.0], "ABV": [4.2, 4.8]}, "text": ["Aroma: light to moderate pome fruit; light slightly sharp sourness; noticeable lemony coriander up to moderate; light doughy bready/yeasty (uncooked sourdough); salt as faint sea-breeze freshness if noticed.", "Flavor: noticeable sourness med-low to med-high; moderate bready/doughy malt; light-mod pome/stone fruit or lemon; light-mod salt up to threshold (noticeable, esp. initially, not overtly salty); very low bitterness; no hop flavor; dry fully attenuated finish; acidity balanced not forward; no THP.", "Mouthfeel: high to very high carbonation; effervescent; med-light to medium-full body; salt gives tingly mouthwatering roundness; not heavy.", "Key: unfiltered, moderate to full haze, yellow, tall tight white head; pilsner + wheat malt, restrained salt and coriander, Lacto (modern inoculated, more balanced than spontaneous historical versions); coriander should be fresh citrusy (not vegetal/celery/ham), salt clean sea/fresh salt (not metallic/iodine); Leipzig/Goslar history, revived 1980s; pronounced GOH-zeh; common base for fruited sours.", "Comparison: less acidic than Berliner Weisse or Gueuze; coriander aroma like Witbier; haze like Weissbier.", "Examples: Anderson Valley Gose, Bayerisch Bahnhof Leipziger Gose, Original Ritterguts Gose, Westbrook Gose."]}, {"code": "24A", "name": "Witbier", "cat": 24, "catName": "Belgian Ale", "stats": {"OG": [1.044, 1.052], "FG": [1.008, 1.012], "IBU": [8.0, 20.0], "SRM": [2.0, 4.0], "ABV": [4.5, 5.5]}, "text": ["Aroma: moderate bready malt (honey/vanilla notes); light grainy-spicy wheat; moderate perfumy-lemony coriander with herbal/spicy/peppery background; moderate zesty citrus-orange fruitiness; low spicy-herbal hop optional (typically absent); spices blend, not overdone.", "Flavor: pleasant bready-grainy malt (honey/vanilla); moderate zesty orange-citrus; subtle balanced herbal-spicy (lemony coriander); hop flavor low to none (spicy-earthy), never overshadows spice; bitterness low to med-low; crisp dry finish, no bitter/harsh aftertaste.", "Mouthfeel: med-light to medium, smooth, light creaminess; effervescent high carbonation; refreshing; no astringency; not thin or heavy.", "Key: very pale straw to deep yellow, very cloudy milky shine from starch/yeast haze, dense white moussy head; unmalted wheat 30-60% (rest low-colour barley malt), maybe 5-10% raw oats/unmalted cereals; coriander seed + dried Curacao orange peel (sweet orange peel too); mild fruity-spicy Belgian ale yeast; no lactic sourness in modern versions; poor coriander can give ham/celery; perishable, fresh best; revived 1966 by Pierre Celis (Hoegaarden).", "Comparison: low bitterness balance like Weissbier but spice and citrus come from additions more than yeast.", "Examples: Allagash White, Blanche de Bruxelles, Celis White, Hoegaarden Wit, Ommegang Witte, St. Bernardus Witbier."]}, {"code": "24B", "name": "Belgian Pale Ale", "cat": 24, "catName": "Belgian Ale", "stats": {"OG": [1.048, 1.054], "FG": [1.01, 1.014], "IBU": [20.0, 30.0], "SRM": [8.0, 14.0], "ABV": [4.8, 5.5]}, "text": ["Aroma: moderate bready malt (toasty, biscuity, nutty; touch of light caramel/honey); moderate to mod-high fruit (pear, orange, apple, lemon, sometimes plum); low-mod spicy/herbal/floral hops; low peppery phenols optional; hops below malt and fruit.", "Flavor: soft moderately malty start (toasty, biscuity, nutty, light caramel, honey); moderate to mod-high fruit; med-low to low hop character; med-high to med-low bitterness (helped by very low peppery phenols); dry to balanced finish; well balanced, no single high-intensity component.", "Mouthfeel: medium to medium-light body; smooth; low alcohol warmth; medium to med-high carbonation.", "Key: top-fermented, ALL-MALT (no adjuncts), not dry-hopped, no strong flavors; amber to copper, very good clarity; pale/character/caramel malts; English or continental hops; fruity low-phenol yeast; aka Speciale Belge; created after 1904 competition (De Koninck).", "Comparison: fairly similar to English Strong Bitter (11C) but different yeast character and more varied malt; less yeast character than most Belgian beers.", "Examples: De Koninck Bolleke, De Ryck Special, Palm, Palm Dobble."]}, {"code": "24C", "name": "Biere de Garde", "cat": 24, "catName": "Belgian Ale", "stats": {"OG": [1.06, 1.08], "FG": [1.008, 1.016], "IBU": [18.0, 28.0], "SRM": [6.0, 19.0], "ABV": [6.0, 8.5]}, "text": ["Aroma: prominent malty richness, often complex toasty-bready; low-mod esters; low spicy/peppery/herbal hops optional; generally clean (light spicy alcohol as it warms); paler versions less rich, a bit more hops.", "Flavor: medium to high malty richness (toasty, biscuity, toffee, light caramel); low-mod esters and alcohol; medium-low bitterness, malty balance; medium-dry to dry finish, not sweet/cloying/heavy; low spicy-pepper-herbal hop optional; malt depth increases with colour, darker not roasted; paler can have slightly more hop flavor.", "Mouthfeel: medium to med-light body, smooth creamy-silky; moderate to high carbonation; moderate alcohol warming, never hot.", "Key: three colour versions (blonde, ambree amber, brune brown); entrant must specify colour; pale, Vienna, Munich base malts, crystal malts, sugar adjuncts possible; lager OR ale yeast fermented at cool ale temps then long cold conditioning (lagered); continental hops; \"cellar/musty/moldy\" character = mishandled import, not the style; oxidation adds caramel/fruit but harshness; Lille farmhouse tradition; Jenlain prototype amber (1940s).", "Comparison: not a Saison (Saison is hoppy/bitter; BdG malty/smooth); malt profile closer to Bock.", "Examples: Ch'Ti Blonde, Jenlain Ambree, La Choulette Brune, Russian River Perdition, Saint Sylvestre 3 Monts Blonde, Two Brothers Domaine DuPage."]}, {"code": "25A", "name": "Belgian Blond Ale", "cat": 25, "catName": "Strong Belgian Ale", "stats": {"OG": [1.062, 1.075], "FG": [1.008, 1.018], "IBU": [15.0, 30.0], "SRM": [4.0, 6.0], "ABV": [6.0, 7.5]}, "text": ["Aroma: light-mod grainy-sweet, slightly toasty/crackery malt; subtle-moderate yeast with citrus esters (orange, lemon) and background spicy-peppery phenols; light earthy/spicy hops optional; light perfumy alcohol, honey/sugar-like sweetness; subtle but complex.", "Flavor: light-mod grainy-sweet malt first; faint caramelized sugar/honey sweetness; medium bitterness, malt slightly ahead; moderate-low yeast profile (orange/lemon, slight pepper); light perfumy possible; light spicy/earthy hop; medium-dry to dry, smooth, soft finish with light alcohol and malt aftertaste.", "Mouthfeel: medium-high to high carbonation (mouth-filling); medium body; light-mod smooth warmth; can be creamy.", "Key: deep yellow to deep gold, very clear, dense creamy head, Belgian lace; most commercial examples 6.5-7%; almost lager-like clean; Belgian Pils malt, aromatic malts, sugar/adjuncts, Belgian abbey yeast, continental hops; spices not traditional (background only); post-WWII creation popularised by Leffe; abbey/artisanal \"Blond\" beers are not representative.", "Comparison: similar strength/balance to Dubbel but gold without dark malt; like Golden Strong or Tripel but maltier, less bitter, lower alcohol.", "Examples: Affligem Blond, Corsendonk Blond, Grimbergen Blond, La Trappe Blond, Leffe Blond, Val-Dieu Blond."]}, {"code": "25B", "name": "Saison", "cat": 25, "catName": "Strong Belgian Ale", "stats": {"OG": [1.048, 1.065], "FG": [1.002, 1.008], "IBU": [20.0, 35.0], "SRM": [5.0, 14.0], "ABV": [3.5, 5.0]}, "text": ["Aroma: fruity-spicy yeast and hops; moderate-high esters (citrus, pome, stone fruit); low to mod-high spice often black pepper, not clove; hops low-mod continental (spicy, floral, earthy, fruity); malt overshadowed, lightly grainy; spices/herbs optional but not dominant; sourness optional; strong versions add alcohol and malt, table less intense, dark add dark-grain malt notes.", "Flavor: balance of fruity-spicy yeast, hoppy bitterness and grainy malt; moderate to high bitterness; very dry finish; fruity/spicy med-low to med-high; hop flavor low-medium; malt low-medium soft grainy; very high attenuation, never sweet or heavy; bitter spicy aftertaste.", "Mouthfeel: light to medium-low body; very high carbonation, effervescent; light warming optional (strong up to medium body and warming; table no warmth); sourness rare but optional.", "Key: pale gold to deep amber (dark copper to brown possible), long-lasting rocky head, unfiltered/variable clarity; entrant must specify strength (table/standard/super) and colour (pale/dark), may name character grains; no correlation between strength and colour; must not be both sour AND bitter; Brett not typical (Brett saisons go to 28A); Grisette = Saison, Session Strength with wheat; pale base malt, cereal grains (wheat, oats, spelt, rye), sugary adjuncts, continental hops, spicy-fruity saison yeast; spices uncommon; Wallonian provision ale, Saison Dupont 1920s.", "Comparison: pale standard version is a more attenuated, hoppier, more bitter Blond with stronger yeast character; super strength pale is like Tripel but more grainy/rustic and sometimes spicier.", "Examples: Ellezelloise Saison 2000, Lefebvre Saison 1900, Saison Dupont, Saison de Pipaix, Saison Voisin, Boulevard Tank 7."]}, {"code": "25C", "name": "Belgian Golden Strong Ale", "cat": 25, "catName": "Strong Belgian Ale", "stats": {"OG": [1.07, 1.095], "FG": [1.005, 1.016], "IBU": [22.0, 35.0], "SRM": [3.0, 6.0], "ABV": [7.5, 10.5]}, "text": ["Aroma: complex fruity esters, herbal hops, peppery alcohol over near-neutral malt; moderate-high esters (pome, esp. pear); herbal/floral/spicy hops low-mod; peppery/perfumy alcohol and phenols low-mod, soft not hot; malt slightly grainy-sweet at most.", "Flavor: like aroma; pear-like esters, peppery alcohol, herbal hops, soft malt carry into long dry finish; medium to high bitterness accentuated by dryness and carbonation, lasting into aftertaste.", "Mouthfeel: very highly carbonated, effervescent; light to medium body, lighter than gravity suggests; smooth but noticeable alcohol warmth, not hot/solventy.", "Key: pale yellow to gold, good clarity, massive long-lasting rocky head with Belgian lace; Pilsner malt with substantial sugar adjuncts; continental hops; fruity Belgian yeast; soft water; spicing not traditional; devil names (Duvel) reference potency; traditionally bottle-conditioned; Moortgat, post-WWI.", "Comparison: often confused with Tripel but usually paler, lighter-bodied, crisper, drier; yeast favors esters (pome) over spice, more late hop.", "Examples: Brigand, Delirium Tremens, Duvel, Judas, Lucifer, Russian River Damnation."]}, {"code": "26A", "name": "Belgian Single", "cat": 26, "catName": "Monastic Ale", "stats": {"OG": [1.044, 1.054], "FG": [1.004, 1.01], "IBU": [25.0, 45.0], "SRM": [3.0, 5.0], "ABV": [4.8, 6.0]}, "text": ["Aroma: med-low to med-high Belgian yeast fruity-spicy; med-low to medium spicy/floral hops (rarely light herbal/citrus spice); low to med-low bready/crackery/grainy/honey malt; varied fruit (apple, pear, grapefruit, lemon, orange, peach, apricot); phenols black pepper or clove; bubblegum inappropriate.", "Flavor: light honeyed-biscuit/bready/cracker malt; grainy but soft palate; crisp dry hoppy-bitter finish; moderate spicy/floral hop flavor; moderate esters; light-mod phenols; medium to high bitterness accentuated by dryness; yeast and hop character linger.", "Mouthfeel: med-light to medium body; smooth; med-high to high carbonation (can be prickly); no noticeable alcohol warmth.", "Key: pale yellow to medium gold, good clarity, billowy white head with lacing; Pilsner malt, Belgian yeast, continental hops; attenuation generally 85%+; monk's table beer (aka Brother's beer/\"Blond\" - term avoided to prevent confusion with Belgian Blond); often not available outside monastery; formerly \"Trappist Single\".", "Comparison: a Belgian top-fermented take on German Pils (pale, hoppy, attenuated, strong Belgian yeast); less sweet, more attenuated, less character malt, more hop-centered than Belgian Pale Ale; like a much smaller, more hopped Tripel rather than a smaller Blond.", "Examples: Chimay Gold, La Trappe Puur, Russian River Redemption, St. Bernardus Extra 4, Westmalle Extra, Westvleteren Blond."]}, {"code": "26B", "name": "Belgian Dubbel", "cat": 26, "catName": "Monastic Ale", "stats": {"OG": [1.062, 1.075], "FG": [1.008, 1.018], "IBU": [15.0, 25.0], "SRM": [10.0, 17.0], "ABV": [6.0, 7.6]}, "text": ["Aroma: moderate to mod-strong rich malt with hints of chocolate, caramelized sugar, toast (never roasted/burnt); moderate esters, dark/dried fruit (raisin, plum), sometimes pome or banana; low-mod spicy-peppery phenols; hops typically absent (low spicy/herbal/floral possible); malt strongest in balance; low soft perfumy alcohol optional.", "Flavor: like aroma; medium-low to medium bitterness but malt always most prominent; esters/phenols add complexity, alcohol not typically tasted; malty-rich, sometimes sweet, finishes moderately dry with malty aftertaste.", "Mouthfeel: smooth, medium to medium-full body; medium-high carbonation; low warmth optional, never hot/solventy.", "Key: dark amber to copper with reddish depth, generally clear, large dense long-lasting creamy off-white head; most commercial examples 6.5-7%; spicy-estery Belgian yeast; impression of complex grist though traditional versions simple, with caramelized sugar syrup/unrefined sugars doing much of the work; continental hops; spices not typical; can taste sweet but actually fairly dry; Westmalle 1922.", "Comparison: perhaps like Dunkles Bock but with Belgian yeast and sugar character; similar strength/balance to Belgian Blond but richer malt and esters; less strong/intense than Dark Strong.", "Examples: Chimay Red, Corsendonk Bruin, La Trappe Dubbel, Rochefort 6, St. Bernardus Pater 6, Westmalle Dubbel."]}, {"code": "26C", "name": "Belgian Tripel", "cat": 26, "catName": "Monastic Ale", "stats": {"OG": [1.075, 1.085], "FG": [1.008, 1.014], "IBU": [20.0, 40.0], "SRM": [4.5, 7.0], "ABV": [7.5, 9.5]}, "text": ["Aroma: complex seamless bouquet; moderate to significant spiciness (peppery, sometimes clove-like phenols), moderate fruity esters (citrus: orange/lemon; slight ripe banana possible), low soft spicy alcohol, low hops (spicy, floral, perfumy optional), light soft grainy-sweet/honey-like malt.", "Flavor: like aroma; esters low-mod, phenols low-mod, hops low-mod, alcohol low, all well combined; medium to high bitterness accentuated by dry finish; moderate bitterness in aftertaste with substantial spicy-fruity yeast; should not be sweet.", "Mouthfeel: med-light to medium body, lighter than gravity suggests; highly carbonated, effervescent; little to no warming (deceptive alcohol); not heavy.", "Key: deep yellow to pale amber, good clarity, long-lasting creamy rocky head with lace; Pilsner malt, often pale sugar adjuncts; continental hops; spicy-fruity Belgian yeast; spices not traditional (background only); soft water; \"sneaky\" strong; most traditional versions >=30 IBU and very dry; Westmalle 1931.", "Comparison: may resemble Golden Strong but slightly darker, fuller-bodied, more phenols less esters, fewer late hops; should not seem like a blond Barleywine.", "Examples: Chimay Tripel, La Rulles Tripel, La Trappe Tripel, St. Bernardus Tripel, Val-Dieu Triple, Westmalle Tripel."]}, {"code": "26D", "name": "Belgian Dark Strong Ale", "cat": 26, "catName": "Monastic Ale", "stats": {"OG": [1.075, 1.11], "FG": [1.01, 1.024], "IBU": [20.0, 35.0], "SRM": [12.0, 22.0], "ABV": [8.0, 12.0]}, "text": ["Aroma: complex fairly intense rich malt and deep fruit, accentuated by spicy phenols and alcohol; malt mod-high to high, deep bready-toasty base with dark caramel, no dark/roasted-malt impression; esters strong to mod-low (raisin, plum, dried cherry, fig, date, prune); low-mod black pepper or vanilla phenols (not clove); soft spicy/perfumy/rose-like alcohol low-mod, never hot/solventy; hops usually not noticeable.", "Flavor: rich complex malt but not heavy in finish; same malt/ester/phenol/alcohol/hop notes as aroma; sweet impression if bitterness low; usually moderately dry to dry finish (may be up to moderately sweet); medium-low to moderate bitterness, alcohol helps balance; flavors blend smoothly, often improve with age; not syrupy.", "Mouthfeel: high carbonation but not sharp; smooth noticeable warmth; body medium-light to medium-full and creamy (most medium).", "Key: deep amber to deep coppery-brown (\"dark\" = deeper than gold, not black), huge dense moussy cream/light-tan head, usually clear; aka Belgian Quad (mainly outside Belgium; \"Quadruple\" is a specific beer); wider interpretation range (traditional drier, modern commercial can be sweet and full); \"Grand Cru\" is a quality claim not a style; spicy-estery Belgian yeast; complex-seeming grist but traditionally simple with caramelized sugar syrup/unrefined sugars; continental hops; spices not typical; Westvleteren pre-WWII.", "Comparison: like a larger Dubbel, fuller body and more malt richness; not as bitter/hoppy as Tripel but similar strength.", "Examples: Achel Extra Bruin, Boulevard The Sixth Glass, Chimay Blue, Rochefort 10, St. Bernardus Abt 12, Westvleteren 12."]}]};
